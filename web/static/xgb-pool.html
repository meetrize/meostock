<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选股宝池 · 题材分组表格</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #fff;
      --line: #e4e8ee;
      --text: #1a2332;
      --muted: #6b7a90;
      --red: #d93025;
      --orange: #c26400;
      --blue: #1a6fb5;
      --green: #1b7f4a;
      --chip: #eef3f8;
      --head: #eef1f5;
      --sticky: #f7f9fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }
    .wrap { max-width: none; margin: 0; padding: 12px 12px 40px; }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .sub { color: var(--muted); margin-bottom: 10px; font-size: 12px; }
    .sub code { background: var(--chip); padding: 1px 5px; border-radius: 3px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 10px;
    }
    button, .pill, a.pill {
      height: 30px; padding: 0 11px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel);
      color: var(--text); cursor: pointer; font-size: 12px;
      display: inline-flex; align-items: center; text-decoration: none;
      gap: 6px;
    }
    button:hover, a.pill:hover { border-color: var(--blue); color: var(--blue); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .pill.muted { color: var(--muted); cursor: default; }
    .toolbar .stat-chip {
      height: 30px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel);
      color: var(--text); cursor: pointer; font-size: 12px;
      display: inline-flex; align-items: center; gap: 4px;
      font-variant-numeric: tabular-nums;
    }
    .toolbar .stat-chip:hover { border-color: var(--blue); color: var(--blue); }
    .toolbar .stat-chip.active {
      border-color: var(--blue); background: #eef6fc; color: var(--blue); font-weight: 600;
    }
    .toolbar .stat-chip b { font-weight: 650; }
    .toolbar .stat-chip .lab { color: var(--muted); font-weight: 400; }
    .toolbar .stat-chip.active .lab { color: var(--blue); }
    .toolbar .stat-chip.muted { opacity: .55; cursor: default; }
    .toolbar-stats {
      display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    body.embed .wrap { padding: 8px 10px 24px; }
    body.embed .toolbar { margin-bottom: 8px; }
    body.embed .toc { margin-bottom: 8px; }
    body.embed #pageTitle,
    body.embed #pageSub,
    body.embed #poolNav,
    body.embed .note { display: none !important; }
    .toc {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
      padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px;
    }
    .toc a {
      font-size: 12px; padding: 2px 8px; border-radius: 4px;
      background: var(--chip); color: var(--text); text-decoration: none;
    }
    .toc a:hover { background: #dce8f4; color: var(--blue); }
    .toc .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
    .group {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 4px; margin-bottom: 2px; overflow: hidden;
    }
    .group-hd {
      display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline;
      padding: 8px 12px; background: var(--head); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 5;
      cursor: pointer; user-select: none;
    }
    .group-hd:hover { background: #e6ebf2; }
    .group.collapsed .group-hd { border-bottom: none; }
    .group.collapsed .group-body { display: none; }
    .group-hd .caret {
      display: inline-block; width: 1em; color: var(--muted); font-size: 12px;
      transition: transform .15s ease;
    }
    .group.collapsed .group-hd .caret { transform: rotate(-90deg); }
    .group-hd h2 {
      margin: 0; font-size: 14px; font-weight: 650;
      display: inline; flex: 1 1 auto; min-width: 0;
    }
    .group-hd a.group-name-link {
      color: inherit; text-decoration: none;
    }
    .group-hd a.group-name-link:hover {
      color: var(--blue); text-decoration: underline;
    }
    .group-hd .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .group-hd .plate-reason {
      color: var(--orange); font-size: 12px; font-weight: 400;
      margin-left: 6px; cursor: pointer; border-radius: 3px;
      padding: 1px 4px; margin-left: 4px;
      transition: background .15s, color .15s;
    }
    .group-hd .plate-reason:hover {
      background: #fff3e8; text-decoration: underline;
    }
    .group-hd .plate-reason.copied {
      color: var(--blue); background: #eef6fc; text-decoration: none;
    }
    .hist-bar {
      display: none; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px; font-size: 12px; color: var(--muted);
    }
    body.history .hist-bar { display: flex; }
    .hist-bar strong { color: var(--text); }
    .hist-modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
      z-index: 40; align-items: center; justify-content: center; padding: 16px;
    }
    .hist-modal-bg.open { display: flex; }
    .hist-modal {
      background: #fff; border-radius: 10px; max-width: 560px; width: 100%;
      max-height: 80vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.18);
      padding: 14px 16px 16px;
    }
    .hist-modal h3 { margin: 0 0 8px; font-size: 15px; }
    .hist-modal .close {
      float: right; border: 0; background: transparent; cursor: pointer;
      font-size: 18px; line-height: 1; color: var(--muted);
    }
    .hist-modal table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .hist-modal th, .hist-modal td {
      border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left;
    }
    .hist-modal th { color: var(--muted); font-weight: 500; }
    .group-hd .plate-stats {
      display: inline-flex; flex-wrap: wrap; gap: 4px 10px;
      align-items: baseline; margin-left: 8px;
      font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums;
    }
    .group-hd .plate-stats .pcp.up { color: var(--red); font-weight: 650; }
    .group-hd .plate-stats .pcp.down { color: var(--green); font-weight: 650; }
    .group-hd .plate-stats .pcp.flat { color: var(--muted); }
    .group-hd .plate-stats .rise { color: var(--red); }
    .group-hd .plate-stats .fall { color: var(--green); }
    .group-hd .plate-stats .stay { color: var(--muted); }
    .group-hd .plate-stats a.theme-link {
      color: var(--blue); text-decoration: none; font-size: 11px;
    }
    .group-hd .plate-stats a.theme-link:hover { text-decoration: underline; }
    .group-hd .plate-stats .stale { opacity: .55; }
    .scroll {
      overflow-x: auto;
      overflow-y: visible;
    }
    table.data {
      width: max-content; min-width: 100%;
      border-collapse: separate; border-spacing: 0;
      font-variant-numeric: tabular-nums;
      table-layout: auto;
    }
    table.data.synced {
      table-layout: fixed;
    }
    table.data th, table.data td {
      padding: 5px 8px; border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      text-align: left; white-space: nowrap; vertical-align: top;
      overflow: hidden; text-overflow: ellipsis;
    }
    table.data th {
      position: sticky; top: 0; z-index: 3;
      background: var(--sticky); color: var(--muted);
      font-weight: 600; font-size: 11px; user-select: none;
    }
    table.data th.sortable { cursor: pointer; }
    table.data th.sortable:hover { color: var(--blue); }
    table.data th.drag-over { outline: 2px solid var(--blue); outline-offset: -2px; }
    table.data th .arrow { margin-left: 2px; color: var(--blue); }
    table.data th .grip { color: #b0bac8; margin-right: 3px; cursor: grab; font-weight: 400; }
    .col-grid .col-item {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
      background: #fff; cursor: grab;
    }
    .col-grid .col-item.drag-over { border-color: var(--blue); background: #eef6fc; }
    .col-grid .col-item .grip { color: #b0bac8; }
    table.data th.sticky-l, table.data td.sticky-l {
      position: sticky; left: 0; z-index: 2;
      background: var(--panel);
      box-shadow: 2px 0 0 var(--line);
    }
    table.data th.sticky-l { z-index: 4; background: var(--sticky); }
    table.data th.sticky-l2, table.data td.sticky-l2 {
      position: sticky; left: var(--sticky-l2-left, 72px); z-index: 2;
      background: var(--panel);
      box-shadow: 2px 0 0 var(--line);
    }
    table.data th.sticky-l2 { z-index: 4; background: var(--sticky); }
    table.data tr:hover td { background: #f0f6fc; }
    table.data tr:hover td.sticky-l,
    table.data tr:hover td.sticky-l2 { background: #f0f6fc; }
    .name { color: var(--orange); font-weight: 650; cursor: pointer; }
    .name:hover { text-decoration: underline; }
    .up { color: var(--red); font-weight: 600; }
    .down { color: var(--green); font-weight: 600; }
    .muted { color: var(--muted); }
    .tl.down-seal { background: #e8f5ee; color: var(--green); }
    .pool-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .pool-nav a.active { border-color: var(--blue); color: var(--blue); background: #eef6fc; }
    .concepts-cell, .timeline-cell {
      white-space: normal;
      word-break: break-word; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .reason-cell.clamp {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: normal;
      max-width: 100%;
    }
    .reason-cell.full {
      display: block;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
      overflow: visible;
      text-overflow: unset;
    }
    th .reason-toggle {
      margin-left: 6px;
      padding: 0 5px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue);
      font-size: 10px;
      cursor: pointer;
      vertical-align: middle;
      line-height: 16px;
    }
    th .reason-toggle:hover { border-color: var(--blue); }
    .tl {
      display: inline-block; font-size: 11px; padding: 1px 5px;
      border-radius: 3px; margin: 1px 2px 1px 0;
    }
    .tl.seal { background: #fde8e6; color: var(--red); }
    .tl.break { background: #e8f5ee; color: var(--green); }
    .links a { color: var(--blue); margin-right: 6px; }
    .err { color: var(--red); padding: 20px; }
    .empty { color: var(--muted); padding: 16px; }
    .note { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.6; }

    /* 列显隐面板 */
    .col-panel {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .col-panel.open { display: block; }
    .col-panel h3 {
      margin: 0 0 8px; font-size: 13px; font-weight: 650;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .col-panel .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .col-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 4px 10px;
    }
    .col-grid label {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0; cursor: pointer; user-select: none;
    }
    .col-grid label input { margin: 0; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="pageTitle">选股宝池</h1>
    <div class="sub" id="pageSub"></div>
    <div class="pool-nav" id="poolNav"></div>

    <div class="hist-bar" id="histBar">
      <strong>历史快照</strong>
      <span id="histDateLabel"></span>
      <span id="histCaptured"></span>
    </div>
    <div class="toolbar" id="mainToolbar">
      <button id="btnRefresh" type="button">刷新</button>
      <button id="btnCols" type="button" title="自定义显示哪些列">列显隐</button>
      <button id="btnCollapseToggle" type="button" title="折叠/展开全部概念组">全部折叠</button>
      <label class="pill muted" title="开启后每只股票只归入第一个关联概念">
        <input id="chkPrimary" type="checkbox" style="margin:0" />
        仅主概念
      </label>
      <span id="stats" class="toolbar-stats"></span>
      <span class="pill muted" id="status">准备中…</span>
    </div>

    <div id="colPanel" class="col-panel" aria-label="列显隐">
      <h3>
        <span>列显隐定制</span>
        <span class="actions">
          <button type="button" id="btnColAll">全选</button>
          <button type="button" id="btnColNone">全不选</button>
          <button type="button" id="btnColDefault">恢复默认</button>
          <button type="button" id="btnColClose">收起</button>
        </span>
      </h3>
      <div class="col-grid" id="colGrid"></div>
      <div class="hint">勾选控制显隐；拖动条目或表头调整列顺序，均自动保存。名称/代码默认固定显示。</div>
    </div>

    <div class="toc" id="toc"></div>
    <div id="root"><div class="empty">加载中…</div></div>
    <p class="note">
      字段说明见 <code>docs/xuangubao-limit-up-pool-api.md</code>。
      同系列：<code>/limit-up</code> · <code>/limit-down</code> · <code>/yesterday-limit-up</code>。
      点击名称打开 K 线；历史模式下点名称看涨跌停履历；「涨因」打开 <code>/zt/{code}</code>。
    </p>
  </div>

  <div class="hist-modal-bg" id="histModalBg" role="dialog" aria-modal="true">
    <div class="hist-modal">
      <button type="button" class="close" id="histModalClose" title="关闭">×</button>
      <h3 id="histModalTitle">涨跌停历史</h3>
      <div id="histModalBody"></div>
    </div>
  </div>

  <script>
    const STOCK_TYPE = { 0: '主板', 1: 'ST主板', 2: '科创', 3: 'ST科创', 4: '创业板', 5: '其它' };

    const POOL_META = {
      limit_up: {
        id: 'limit_up', title: '当前涨停', short: '涨停', path: '/limit-up',
        dash: '/dashboard/limit-up', mode: 'up',
        defaultSort: 'first_limit_up', reasonLabel: '涨停原因',
        countLabel: '涨停', boardLabel: '连板',
      },
      limit_down: {
        id: 'limit_down', title: '当前跌停', short: '跌停', path: '/limit-down',
        dash: '/dashboard/limit-down', mode: 'down',
        defaultSort: 'first_limit_down', reasonLabel: '原因',
        countLabel: '跌停', boardLabel: '连跌',
      },
      yesterday_limit_up: {
        id: 'yesterday_limit_up', title: '昨日涨停', short: '昨涨停', path: '/yesterday-limit-up',
        dash: '/dashboard/yesterday-limit-up', mode: 'up',
        defaultSort: 'first_limit_up', reasonLabel: '涨停原因',
        countLabel: '昨涨停', boardLabel: '连板',
      },
    };
    const PATH_TO_POOL = {
      '/limit-up': 'limit_up',
      '/limit-down': 'limit_down',
      '/yesterday-limit-up': 'yesterday_limit_up',
      '/xgb-pool': 'limit_up',
    };

    function resolvePoolId() {
      const q = new URLSearchParams(location.search).get('pool');
      if (q && POOL_META[q]) return q;
      const path = (location.pathname || '').replace(/\/+$/, '') || '/';
      return PATH_TO_POOL[path] || 'limit_up';
    }

    const poolId = resolvePoolId();
    const pool = POOL_META[poolId];
    const LS_COLS = 'mootdx.xgb.' + poolId + '.cols.v2';
    const LS_ORDER = 'mootdx.xgb.' + poolId + '.order.v2';
    const LS_SORT = 'mootdx.xgb.' + poolId + '.sort.v2';
    const LS_REASON_FULL = 'mootdx.xgb.' + poolId + '.reason-full.v1';
    const LS_COLLAPSED = 'mootdx.xgb.' + poolId + '.collapsed.v1';
    // 兼容旧版当前涨停页的 localStorage
    const LS_COLS_LEGACY = poolId === 'limit_up' ? 'mootdx.limit-up.cols.v2' : '';
    const LS_ORDER_LEGACY = poolId === 'limit_up' ? 'mootdx.limit-up.order.v2' : '';
    const LS_SORT_LEGACY = poolId === 'limit_up' ? 'mootdx.limit-up.sort.v2' : '';
    const LS_REASON_LEGACY = poolId === 'limit_up' ? 'mootdx.limit-up.reason-full.v1' : '';
    const DEFAULT_SORT = { key: pool.defaultSort, dir: 'asc' };

    function loadReasonFull() {
      try {
        const v = localStorage.getItem(LS_REASON_FULL);
        if (v != null) return v === '1';
        if (LS_REASON_LEGACY) return localStorage.getItem(LS_REASON_LEGACY) === '1';
      } catch (_) { /* ignore */ }
      return false;
    }
    function saveReasonFull(v) {
      try { localStorage.setItem(LS_REASON_FULL, v ? '1' : '0'); } catch (_) { /* ignore */ }
    }
    let reasonFull = loadReasonFull();

    function loadCollapsed() {
      try {
        const raw = localStorage.getItem(LS_COLLAPSED);
        if (!raw) return new Set();
        const arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr.map(String) : []);
      } catch (_) { return new Set(); }
    }
    function saveCollapsed() {
      try { localStorage.setItem(LS_COLLAPSED, JSON.stringify([...collapsedGroups])); } catch (_) { /* ignore */ }
    }
    let collapsedGroups = loadCollapsed();
    /** @type {string[]} */
    let lastGroupNames = [];

    const pageQs = new URLSearchParams(location.search);
    const isEmbed = pageQs.get('embed') === '1';
    const historyDate = (() => {
      const raw = (pageQs.get('date') || '').replace(/\D/g, '');
      return raw.length === 8 ? raw : '';
    })();
    const historyMode = !!historyDate;
    if (isEmbed) document.body.classList.add('embed');
    if (historyMode) document.body.classList.add('history');

    /** @type {Record<string, any>} */
    let historyPlateMap = {};

    document.title = (historyMode ? '历史 · ' : '') + pool.title + ' · 选股宝';
    document.getElementById('pageTitle').textContent =
      (historyMode ? '历史' + historyDate + ' · ' : '') + pool.title;
    document.getElementById('pageSub').innerHTML = historyMode
      ? '历史快照 <code>/api/zt/history/day?date=' + historyDate + '&amp;pool=' + pool.id + '</code>。'
      : '数据源 <code>/api/zt/pool?pool=' + pool.id + '</code>。按<strong>概念分组</strong>；表头排序（升序→降序→取消）；拖动表头改列序。';
    document.getElementById('poolNav').innerHTML = Object.values(POOL_META).map((p) =>
      '<a class="pill' + (p.id === poolId ? ' active' : '') + '" href="' + p.path +
        (historyMode ? '?date=' + historyDate : '') + '">' + p.title + '</a>'
    ).join('') +
      '<a class="pill" href="/dashboard/zt-history">涨跌停历史</a>' +
      '<a class="pill" href="/dashboard/fupan">复盘</a>';
    if (historyMode) {
      document.getElementById('histDateLabel').textContent = historyDate;
      document.getElementById('btnRefresh').textContent = '重新加载';
    }

    /** @type {null|'all'|'lianban'|'broken'|'maxboard'|'liandie'|'maxdown'} */
    let filterMode = null;
    let lastFilterMeta = { maxBoard: 0, maxDown: 0 };

    function applyRowFilter(rows) {
      if (!filterMode || filterMode === 'all') return rows;
      if (filterMode === 'lianban') return rows.filter((x) => (x.limit_up_days || 0) > 1);
      if (filterMode === 'broken') return rows.filter((x) => (x.break_limit_up_times || 0) > 0);
      if (filterMode === 'maxboard') {
        const m = lastFilterMeta.maxBoard;
        return m > 0 ? rows.filter((x) => (x.limit_up_days || 0) === m) : rows;
      }
      if (filterMode === 'liandie') return rows.filter((x) => (x.limit_down_days || 0) > 1);
      if (filterMode === 'maxdown') {
        const m = lastFilterMeta.maxDown;
        return m > 0 ? rows.filter((x) => (x.limit_down_days || 0) === m) : rows;
      }
      return rows;
    }

    function chipHtml(key, value, label, clickable) {
      const active = filterMode === key || (key === 'all' && !filterMode);
      const cls = 'stat-chip' + (active ? ' active' : '') + (clickable ? '' : ' muted');
      const attrs = clickable
        ? ' type="button" data-filter="' + key + '"'
        : ' type="button" disabled';
      return (
        '<button class="' + cls + '"' + attrs + '>' +
          '<b>' + esc(String(value)) + '</b>' +
          '<span class="lab">' + esc(label) + '</span>' +
        '</button>'
      );
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function codeOf(sym) {
      return String(sym || '').replace(/\.(SS|SH|SZ|BJ)$/i, '');
    }

    function fmtPct(x) {
      if (x == null || Number.isNaN(Number(x))) return '--';
      const v = Number(x) * (Math.abs(Number(x)) < 1 ? 100 : 1);
      return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    function fmtPrice(x) {
      if (x == null || Number.isNaN(Number(x))) return '--';
      return Number(x).toFixed(2);
    }

    function fmtRatio(x) {
      if (x == null || Number.isNaN(Number(x))) return '--';
      const v = Number(x);
      const p = Math.abs(v) <= 1.5 ? v * 100 : v;
      return p.toFixed(2) + '%';
    }

    function fmtYi(x) {
      if (x == null || Number.isNaN(Number(x))) return '--';
      return (Number(x) / 1e8).toFixed(2) + '亿';
    }

    function fmtTime(ts) {
      const n = Number(ts);
      if (!n) return '--';
      const d = new Date(n * 1000);
      return [d.getHours(), d.getMinutes(), d.getSeconds()]
        .map((x) => String(x).padStart(2, '0')).join(':');
    }

    function fmtDate(ts) {
      const n = Number(ts);
      if (!n) return '--';
      const d = new Date(n * 1000);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function numOrNeg(x) {
      const n = Number(x);
      return Number.isFinite(n) && n !== 0 ? n : (n === 0 ? 0 : -1);
    }

    function boardLabel(item) {
      if (pool.mode === 'down') {
        const d = item.limit_down_days || 0;
        return d > 1 ? d + '连跌' : (d === 1 ? '首跌' : '--');
      }
      const days = item.m_days_n_boards_days || 0;
      const boards = item.m_days_n_boards_boards || 0;
      const lu = item.limit_up_days || 1;
      if (days > 0 && boards > 0) return days + '天' + boards + '板';
      return lu > 1 ? lu + '板' : '首板';
    }

    function platesOf(item) {
      return (item?.surge_reason?.related_plates || []).filter((p) => p && p.plate_name);
    }

    function conceptsText(item) {
      const plates = platesOf(item);
      return plates.map((p) => p.plate_name).join('、') || '其他';
    }

    function timelineSeal(status) {
      const s = Number(status);
      // 1=封涨停 2=打开 3=封跌停（选股宝）
      return s === 1 || s === 3;
    }

    function timelineText(item) {
      return ((item.limit_timeline && item.limit_timeline.items) || [])
        .map((t) => {
          const seal = timelineSeal(t.status);
          const lab = pool.mode === 'down' ? (seal ? '跌停' : '打开') : (seal ? '封' : '开');
          return lab + ' ' + fmtTime(t.timestamp);
        })
        .join(' / ');
    }

    function timelineHtml(item) {
      return ((item.limit_timeline && item.limit_timeline.items) || [])
        .map((t) => {
          const seal = timelineSeal(t.status);
          const cls = pool.mode === 'down'
            ? (seal ? 'down-seal' : 'break')
            : (seal ? 'seal' : 'break');
          const lab = pool.mode === 'down' ? (seal ? '跌停' : '打开') : (seal ? '封' : '开');
          return '<span class="tl ' + cls + '">' + lab + ' ' + fmtTime(t.timestamp) + '</span>';
        })
        .join('') || '<span class="muted">--</span>';
    }

    const COL_BY_ID = Object.fromEntries(COLS.map((c) => [c.id, c]));

    function defaultVisibility() {
      const o = {};
      for (const c of COLS) o[c.id] = !!c.def;
      return o;
    }

    function defaultOrder() {
      return COLS.map((c) => c.id);
    }

    function loadVisibility() {
      const base = defaultVisibility();
      try {
        let raw = localStorage.getItem(LS_COLS);
        if (!raw && LS_COLS_LEGACY) raw = localStorage.getItem(LS_COLS_LEGACY);
        if (!raw && poolId === 'limit_up') raw = localStorage.getItem('mootdx.limit-up.cols.v1');
        if (!raw) return base;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return base;
        // 旧版「分组概念/全部概念」合并为「概念」
        if (typeof saved.concept !== 'boolean') {
          if (saved.group_concept === true || saved.concepts === true) saved.concept = true;
          if (saved.group_concept === false && saved.concepts === false) saved.concept = false;
        }
        for (const c of COLS) {
          if (c.fixed) { base[c.id] = true; continue; }
          if (typeof saved[c.id] === 'boolean') base[c.id] = saved[c.id];
        }
      } catch (_) { /* ignore */ }
      return base;
    }

    function saveVisibility(vis) {
      const out = {};
      for (const c of COLS) {
        if (c.fixed) continue;
        out[c.id] = !!vis[c.id];
      }
      try { localStorage.setItem(LS_COLS, JSON.stringify(out)); } catch (_) { /* ignore */ }
    }

    function loadOrder() {
      const def = defaultOrder();
      try {
        let raw = localStorage.getItem(LS_ORDER);
        if (!raw && LS_ORDER_LEGACY) raw = localStorage.getItem(LS_ORDER_LEGACY);
        if (!raw) return def;
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved)) return def;
        const known = new Set(def);
        const next = [];
        for (const id of saved) {
          if (id === 'group_concept' || id === 'concepts') {
            if (!next.includes('concept') && known.has('concept')) next.push('concept');
            continue;
          }
          if (known.has(id) && !next.includes(id)) next.push(id);
        }
        for (const id of def) if (!next.includes(id)) next.push(id);
        return next;
      } catch (_) { /* ignore */ }
      return def;
    }

    function saveOrder(order) {
      try { localStorage.setItem(LS_ORDER, JSON.stringify(order)); } catch (_) { /* ignore */ }
    }

    function loadSort() {
      try {
        let raw = localStorage.getItem(LS_SORT);
        if (!raw && LS_SORT_LEGACY) raw = localStorage.getItem(LS_SORT_LEGACY);
        if (!raw) return { ...DEFAULT_SORT, active: false };
        const s = JSON.parse(raw);
        if (s && s.active === false) return { ...DEFAULT_SORT, active: false };
        if (s && s.key && COL_BY_ID[s.key]) {
          return { key: s.key, dir: s.dir === 'desc' ? 'desc' : 'asc', active: true };
        }
      } catch (_) { /* ignore */ }
      return { ...DEFAULT_SORT, active: false };
    }

    function saveSort(sort) {
      try { localStorage.setItem(LS_SORT, JSON.stringify(sort)); } catch (_) { /* ignore */ }
    }

    let visibility = loadVisibility();
    let colOrder = loadOrder();
    let sortState = loadSort();
    let cacheRows = [];
    let dragColId = null;
    let suppressSortClick = false;

    function orderedCols() {
      return colOrder.map((id) => COL_BY_ID[id]).filter(Boolean);
    }

    function visibleCols() {
      return orderedCols().filter((c) => visibility[c.id] || c.fixed);
    }

    function activeSortCol() {
      if (sortState.active && sortState.key && COL_BY_ID[sortState.key]) {
        return COL_BY_ID[sortState.key];
      }
      return COL_BY_ID[DEFAULT_SORT.key];
    }

    function activeSortDir() {
      return sortState.active ? sortState.dir : DEFAULT_SORT.dir;
    }

    function compareItems(a, b, ctxA, ctxB) {
      const col = activeSortCol();
      const dir = activeSortDir();
      const va = col.getSort(a, ctxA);
      const vb = col.getSort(b, ctxB);
      let cmp = 0;
      if (col.sortType === 'num' || col.sortType === 'time') {
        const na = Number(va);
        const nb = Number(vb);
        const aBad = !Number.isFinite(na) || (col.sortType === 'time' && na < 0);
        const bBad = !Number.isFinite(nb) || (col.sortType === 'time' && nb < 0);
        if (aBad && bBad) cmp = 0;
        else if (aBad) cmp = 1;
        else if (bBad) cmp = -1;
        else cmp = na - nb;
      } else {
        cmp = String(va ?? '').localeCompare(String(vb ?? ''), 'zh');
      }
      if (cmp === 0) cmp = String(a.symbol || '').localeCompare(String(b.symbol || ''));
      return dir === 'desc' ? -cmp : cmp;
    }

    function moveCol(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return false;
      const from = colOrder.indexOf(fromId);
      const to = colOrder.indexOf(toId);
      if (from < 0 || to < 0) return false;
      const next = colOrder.slice();
      next.splice(from, 1);
      next.splice(to, 0, fromId);
      colOrder = next;
      saveOrder(colOrder);
      return true;
    }

    function buildGroups(rows, primaryOnly) {
      const groups = new Map();
      const plateReasonMap = new Map();
      const plateIdMap = new Map();

      function rememberPlate(p) {
        if (!p || !p.plate_name) return;
        if (p.plate_reason && !plateReasonMap.has(p.plate_name)) {
          plateReasonMap.set(p.plate_name, p.plate_reason);
        }
        if (p.plate_id != null && p.plate_id !== '' && !plateIdMap.has(p.plate_name)) {
          plateIdMap.set(p.plate_name, String(p.plate_id));
        }
      }

      for (const item of rows) {
        const plates = platesOf(item);
        let names;
        if (!plates.length) {
          names = ['其他'];
        } else if (primaryOnly) {
          names = [plates[0].plate_name];
          rememberPlate(plates[0]);
        } else {
          names = plates.map((p) => {
            rememberPlate(p);
            return p.plate_name;
          });
        }
        for (const name of names) {
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(item);
        }
      }

      const ordered = [...groups.entries()].map(([name, list]) => {
        const ctx = { groupName: name };
        const sorted = [...list].sort((a, b) => compareItems(a, b, ctx, ctx));
        const earliest = sorted.reduce((m, x) => {
          const t = Number(x.first_limit_up) || 0;
          if (!t) return m;
          return m === 0 ? t : Math.min(m, t);
        }, 0);
        return {
          name,
          list: sorted,
          earliest,
          reason: plateReasonMap.get(name) || '',
          plateId: plateIdMap.get(name) || '',
        };
      });

      ordered.sort((a, b) => {
        if (a.name === '其他') return 1;
        if (b.name === '其他') return -1;
        if (b.list.length !== a.list.length) return b.list.length - a.list.length;
        if (a.earliest && b.earliest && a.earliest !== b.earliest) return a.earliest - b.earliest;
        return a.name.localeCompare(b.name, 'zh');
      });

      return ordered;
    }

    function sortArrow(colId) {
      if (!sortState.active || sortState.key !== colId) return '';
      return '<span class="arrow">' + (sortState.dir === 'asc' ? '▲' : '▼') + '</span>';
    }

    function stickyClassFor(cols, idx, c) {
      // 仅当名称/代码仍在最左侧时保留冻结
      if (idx === 0 && c.id === 'name') return 'sticky-l';
      if (idx === 1 && c.id === 'code' && cols[0] && cols[0].id === 'name') return 'sticky-l2';
      return '';
    }

    function renderTable(list, groupName) {
      const cols = visibleCols();
      const ctx = { groupName };
      const colgroup = cols.map((c) =>
        '<col data-col="' + esc(c.id) + '" />'
      ).join('');
      const head = cols.map((c, idx) => {
        const sticky = stickyClassFor(cols, idx, c);
        const cls = ['sortable', sticky].filter(Boolean).join(' ');
        let extra = '';
        if (c.id === 'stock_reason') {
          extra = '<button type="button" class="reason-toggle" data-reason-toggle="1" title="切换完整/一行显示">' +
            (reasonFull ? '一行' : '完整') + '</button>';
        }
        return '<th class="' + cls + '" data-col="' + esc(c.id) + '" draggable="true" title="点击排序 · 拖动调整顺序">' +
          '<span class="grip">⋮⋮</span>' + esc(c.label) + extra + sortArrow(c.id) + '</th>';
      }).join('');

      const body = list.map((it) => {
        const tds = cols.map((c, idx) => {
          const sticky = stickyClassFor(cols, idx, c);
          return '<td class="' + sticky + '" data-col="' + esc(c.id) + '">' + c.render(it, ctx) + '</td>';
        }).join('');
        return '<tr>' + tds + '</tr>';
      }).join('');

      return (
        '<div class="scroll">' +
          '<table class="data">' +
            '<colgroup>' + colgroup + '</colgroup>' +
            '<thead><tr>' + head + '</tr></thead>' +
            '<tbody>' + body + '</tbody>' +
          '</table>' +
        '</div>'
      );
    }

    /** 各组表格共用同一套列宽（取全局内容最大值） */
    function syncColumnWidths() {
      const cols = visibleCols();
      if (!cols.length) return;
      const tables = [...document.querySelectorAll('#root table.data')];
      if (!tables.length) return;

      // 先按 auto 量自然宽度
      tables.forEach((t) => {
        t.classList.remove('synced');
        t.style.width = 'max-content';
        t.querySelectorAll('colgroup col').forEach((col) => {
          col.style.width = '';
          col.style.minWidth = '';
        });
      });

      const MIN = {
        name: 72, code: 64, concept: 88, stock_reason: reasonFull ? 420 : 360,
        timeline: 160, links: 72,
      };
      const MAX = {
        stock_reason: reasonFull ? 720 : 640, timeline: 300, concept: 140,
      };
      const widths = {};
      for (const c of cols) widths[c.id] = MIN[c.id] || 64;

      for (const table of tables) {
        table.querySelectorAll('thead th[data-col]').forEach((th) => {
          const id = th.getAttribute('data-col');
          if (!id) return;
          widths[id] = Math.max(widths[id] || 0, Math.ceil(th.scrollWidth) + 2);
        });
        const rows = table.querySelectorAll('tbody tr');
        const limit = Math.min(rows.length, 40);
        for (let i = 0; i < limit; i++) {
          rows[i].querySelectorAll('td[data-col]').forEach((td) => {
            const id = td.getAttribute('data-col');
            if (!id) return;
            widths[id] = Math.max(widths[id] || 0, Math.ceil(td.scrollWidth) + 2);
          });
        }
      }

      for (const c of cols) {
        if (MAX[c.id]) widths[c.id] = Math.min(widths[c.id], MAX[c.id]);
        widths[c.id] = Math.max(widths[c.id], MIN[c.id] || 56);
      }

      const total = cols.reduce((s, c) => s + widths[c.id], 0);
      const nameW = widths.name || 72;
      document.documentElement.style.setProperty('--sticky-l2-left', nameW + 'px');

      for (const table of tables) {
        table.querySelectorAll('colgroup col').forEach((col) => {
          const id = col.getAttribute('data-col');
          const w = widths[id];
          if (!w) return;
          col.style.width = w + 'px';
          col.style.minWidth = w + 'px';
        });
        table.style.width = total + 'px';
        table.classList.add('synced');
      }
    }

    function groupId(name, idx) {
      return 'g-' + idx + '-' + String(name).replace(/[^\w\u4e00-\u9fff-]+/g, '_').slice(0, 40);
    }

    function render(allRows) {
      const maxBoard = allRows.reduce((m, x) => Math.max(m, x.limit_up_days || 0), 0);
      const lianban = allRows.filter((x) => (x.limit_up_days || 0) > 1).length;
      const broken = allRows.filter((x) => (x.break_limit_up_times || 0) > 0).length;
      const maxDown = allRows.reduce((m, x) => Math.max(m, x.limit_down_days || 0), 0);
      const lianDie = allRows.filter((x) => (x.limit_down_days || 0) > 1).length;
      lastFilterMeta = { maxBoard, maxDown };

      const statsEl = document.getElementById('stats');
      if (pool.mode === 'down') {
        statsEl.innerHTML =
          chipHtml('all', allRows.length, pool.countLabel, true) +
          chipHtml('liandie', lianDie, '连跌', true) +
          chipHtml('maxdown', maxDown ? maxDown + '天' : '--', '最长', !!maxDown);
      } else {
        statsEl.innerHTML =
          chipHtml('all', allRows.length, pool.countLabel, true) +
          chipHtml('lianban', lianban, pool.boardLabel, true) +
          chipHtml('maxboard', maxBoard ? maxBoard + '板' : '--', '最高', !!maxBoard) +
          chipHtml('broken', broken, '曾开', true);
      }

      const rows = applyRowFilter(allRows);
      const primaryOnly = document.getElementById('chkPrimary').checked;
      const groups = buildGroups(rows, primaryOnly);

      document.getElementById('toc').innerHTML = groups.map((g, i) =>
        '<a href="#' + groupId(g.name, i) + '">' + esc(g.name) +
        '<span class="n">' + g.list.length + '</span></a>'
      ).join('') || '';

      let sortHint;
      if (sortState.active) {
        const col = COL_BY_ID[sortState.key];
        sortHint = '排序 ' + (col ? col.label : sortState.key) + (sortState.dir === 'asc' ? '↑' : '↓');
      } else {
        sortHint = '默认' + (COL_BY_ID[DEFAULT_SORT.key]?.label || DEFAULT_SORT.key) + '↑';
      }
      if (filterMode && filterMode !== 'all') {
        const labels = {
          lianban: '连板', broken: '曾开', maxboard: '最高板',
          liandie: '连跌', maxdown: '最长连跌',
        };
        sortHint = (labels[filterMode] || filterMode) + '筛选 · ' + sortHint;
      }
      lastGroupNames = groups.map((g) => g.name);
      document.getElementById('root').innerHTML = groups.map((g, i) => {
        const firstTimes = g.list
          .map((x) => Number(pool.mode === 'down' ? x.first_limit_down : x.first_limit_up) || 0)
          .filter(Boolean);
        const span = firstTimes.length
          ? fmtTime(Math.min(...firstTimes)) + ' → ' + fmtTime(Math.max(...firstTimes))
          : '';
        const isCollapsed = collapsedGroups.has(g.name);
        const plateAttr = g.plateId ? ' data-plate-id="' + esc(g.plateId) + '"' : '';
        const themeUrl = g.plateId
          ? 'https://xuangutong.com.cn/theme/' + encodeURIComponent(g.plateId)
          : '';
        const nameHtml = themeUrl
          ? '<a class="group-name-link" href="' + themeUrl + '" target="_blank" rel="noopener" ' +
              'onclick="event.stopPropagation()" title="打开选股宝主题页">' + esc(g.name) + '</a>'
          : esc(g.name);
        const statsHtml = g.plateId
          ? '<span class="plate-stats" data-plate-stats="' + esc(g.plateId) + '">' +
              '<span class="pcp flat">--</span>' +
              '<span class="rise">涨 --</span>' +
              '<span class="fall">跌 --</span>' +
              '<span class="stay">平 --</span>' +
            '</span>'
          : '';
        return (
          '<section class="group' + (isCollapsed ? ' collapsed' : '') + '" id="' + groupId(g.name, i) +
            '" data-group-name="' + esc(g.name) + '"' + plateAttr + '>' +
            '<div class="group-hd" data-group-toggle="1" title="点击折叠/展开">' +
              '<span class="caret">▼</span>' +
              '<h2>' + nameHtml +
                statsHtml +
                (g.reason
                  ? '<span class="plate-reason" data-copy-reason="1" title="点击复制主题驱动理由">' +
                      esc(g.reason) + '</span>'
                  : '') +
              '</h2>' +
              '<span class="meta">' + g.list.length + ' 只' +
                (span ? ' · 首封区间 ' + esc(span) : '') +
                ' · ' + esc(sortHint) +
              '</span>' +
            '</div>' +
            '<div class="group-body">' + renderTable(g.list, g.name) + '</div>' +
          '</section>'
        );
      }).join('') || '<div class="empty">' +
        (filterMode && filterMode !== 'all' ? '当前筛选无匹配股票，点击工具栏统计可取消' : '暂无数据') +
        '</div>';

      updateCollapseButtons();
      refreshPlateStats();
      // 显隐/改序/排序后统一各组列宽
      requestAnimationFrame(() => {
        syncColumnWidths();
        requestAnimationFrame(syncColumnWidths);
      });
    }

    const PLATE_FIELDS = 'core_avg_pcp,plate_name,rise_count,fall_count,stay_count,limit_up_count';
    const PLATE_POLL_MS = 8000;
    let platePollTimer = null;
    let plateFetchGen = 0;

    function fmtPlatePcp(x) {
      if (x == null || Number.isNaN(Number(x))) return { text: '--', cls: 'flat' };
      const v = Number(x) * (Math.abs(Number(x)) < 1.5 ? 100 : 1);
      const text = (v > 0 ? '+' : '') + v.toFixed(2) + '%';
      const cls = v > 0 ? 'up' : (v < 0 ? 'down' : 'flat');
      return { text, cls };
    }

    function applyPlateStats(dataMap) {
      document.querySelectorAll('#root [data-plate-stats]').forEach((el) => {
        const id = el.getAttribute('data-plate-stats');
        const row = dataMap && dataMap[id];
        el.classList.remove('stale');
        if (!row) {
          el.classList.add('stale');
          return;
        }
        const pcp = fmtPlatePcp(row.core_avg_pcp);
        const rise = row.rise_count != null ? String(row.rise_count) : '--';
        const fall = row.fall_count != null ? String(row.fall_count) : '--';
        const stay = row.stay_count != null ? String(row.stay_count) : '--';
        const lim = row.limit_up_count != null ? String(row.limit_up_count) : null;
        el.innerHTML =
          '<span class="pcp ' + pcp.cls + '">' + esc(pcp.text) + '</span>' +
          '<span class="rise">涨 ' + esc(rise) + '</span>' +
          '<span class="fall">跌 ' + esc(fall) + '</span>' +
          '<span class="stay">平 ' + esc(stay) + '</span>' +
          (lim != null ? '<span class="rise">板 ' + esc(lim) + '</span>' : '');
      });
    }

    async function refreshPlateStats() {
      if (historyMode) {
        applyPlateStats(historyPlateMap);
        return;
      }
      const ids = [...new Set(
        [...document.querySelectorAll('#root [data-plate-id]')]
          .map((el) => el.getAttribute('data-plate-id'))
          .filter(Boolean)
      )];
      if (!ids.length) return;
      const gen = ++plateFetchGen;
      try {
        const url = '/api/zt/plate-data?plates=' + encodeURIComponent(ids.join(',')) +
          '&fields=' + encodeURIComponent(PLATE_FIELDS);
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();
        if (gen !== plateFetchGen) return;
        if (!data.ok || !data.data) throw new Error(data.error || 'plate-data failed');
        applyPlateStats(data.data);
      } catch (_) {
        if (gen !== plateFetchGen) return;
        document.querySelectorAll('#root [data-plate-stats]').forEach((el) => {
          el.classList.add('stale');
        });
      }
    }

    function startPlatePolling() {
      if (historyMode) return;
      if (platePollTimer) clearInterval(platePollTimer);
      platePollTimer = setInterval(() => {
        if (document.hidden) return;
        refreshPlateStats();
      }, PLATE_POLL_MS);
    }

    function allGroupsCollapsed() {
      return lastGroupNames.length > 0 &&
        lastGroupNames.every((name) => collapsedGroups.has(name));
    }

    function updateCollapseButtons() {
      const btn = document.getElementById('btnCollapseToggle');
      if (!btn) return;
      const total = lastGroupNames.length;
      btn.disabled = total === 0;
      if (allGroupsCollapsed()) {
        btn.textContent = '全部展开';
        btn.title = '展开全部概念组';
      } else {
        btn.textContent = '全部折叠';
        btn.title = '折叠全部概念组';
      }
    }

    function setGroupCollapsed(name, collapsed) {
      if (collapsed) collapsedGroups.add(name);
      else collapsedGroups.delete(name);
      saveCollapsed();
      const sec = [...document.querySelectorAll('#root .group')].find(
        (el) => el.getAttribute('data-group-name') === name
      );
      if (sec) sec.classList.toggle('collapsed', collapsed);
      updateCollapseButtons();
    }

    function toggleCollapseAllGroups() {
      if (allGroupsCollapsed()) {
        collapsedGroups.clear();
        document.querySelectorAll('#root .group').forEach((el) => el.classList.remove('collapsed'));
      } else {
        for (const name of lastGroupNames) collapsedGroups.add(name);
        document.querySelectorAll('#root .group').forEach((el) => el.classList.add('collapsed'));
      }
      saveCollapsed();
      updateCollapseButtons();
    }

    function renderColPanel() {
      document.getElementById('colGrid').innerHTML = orderedCols().map((c) => {
        const checked = visibility[c.id] || c.fixed ? ' checked' : '';
        const disabled = c.fixed ? ' disabled' : '';
        return '<div class="col-item" draggable="true" data-col="' + esc(c.id) + '">' +
          '<span class="grip">⋮⋮</span>' +
          '<label><input type="checkbox" data-col="' + esc(c.id) + '"' +
          checked + disabled + ' />' + esc(c.label) +
          (c.fixed ? ' <span class="muted">固定显隐</span>' : '') +
          '</label></div>';
      }).join('');
    }

    function cycleSort(key) {
      if (!key || key === 'links') return;
      if (sortState.active && sortState.key === key) {
        if (sortState.dir === 'asc') {
          sortState = { key, dir: 'desc', active: true };
        } else {
          // 第三次：取消当前列排序 → 回默认首封升序（不显示主动排序箭头）
          sortState = { ...DEFAULT_SORT, active: false };
        }
      } else {
        const preferAsc = key === 'first_limit_up' || key === 'first_limit_down' ||
          key === 'name' || key === 'code' || key === 'concept';
        sortState = { key, dir: preferAsc ? 'asc' : 'desc', active: true };
      }
      saveSort(sortState);
      if (cacheRows.length) render(cacheRows);
    }

    function bindRootInteractions() {
      const root = document.getElementById('root');

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) { /* fall through */ }
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;left:-9999px;top:0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      root.addEventListener('click', (ev) => {
        const toggle = ev.target.closest('[data-reason-toggle]');
        if (toggle && root.contains(toggle)) {
          ev.preventDefault();
          ev.stopPropagation();
          reasonFull = !reasonFull;
          saveReasonFull(reasonFull);
          if (cacheRows.length) render(cacheRows);
          return;
        }
        const reasonEl = ev.target.closest('[data-copy-reason]');
        if (reasonEl && root.contains(reasonEl)) {
          ev.preventDefault();
          ev.stopPropagation();
          const text = (reasonEl.textContent || '').trim();
          if (!text) return;
          void copyText(text).then((ok) => {
            if (!ok) return;
            reasonEl.classList.add('copied');
            const prev = reasonEl.getAttribute('title') || '';
            reasonEl.setAttribute('title', '已复制');
            clearTimeout(reasonEl._copyTimer);
            reasonEl._copyTimer = setTimeout(() => {
              reasonEl.classList.remove('copied');
              reasonEl.setAttribute('title', prev || '点击复制主题驱动理由');
            }, 1200);
          });
          return;
        }
        const groupHd = ev.target.closest('[data-group-toggle]');
        if (groupHd && root.contains(groupHd)) {
          ev.preventDefault();
          const sec = groupHd.closest('.group');
          const name = sec && sec.getAttribute('data-group-name');
          if (name) setGroupCollapsed(name, !collapsedGroups.has(name));
          return;
        }
        if (suppressSortClick) {
          suppressSortClick = false;
          return;
        }
        const th = ev.target.closest('th[data-col]');
        if (!th || !root.contains(th)) return;
        cycleSort(th.getAttribute('data-col'));
      });

      root.addEventListener('dragstart', (ev) => {
        if (ev.target.closest('[data-reason-toggle]')) {
          ev.preventDefault();
          return;
        }
        const th = ev.target.closest('th[data-col]');
        if (!th) return;
        dragColId = th.getAttribute('data-col');
        th.classList.add('dragging');
        try { ev.dataTransfer.setData('text/plain', dragColId); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
      });
      root.addEventListener('dragend', () => {
        dragColId = null;
        root.querySelectorAll('th.drag-over').forEach((el) => el.classList.remove('drag-over'));
      });
      root.addEventListener('dragover', (ev) => {
        const th = ev.target.closest('th[data-col]');
        if (!th || !dragColId) return;
        ev.preventDefault();
        root.querySelectorAll('th.drag-over').forEach((el) => {
          if (el !== th) el.classList.remove('drag-over');
        });
        th.classList.add('drag-over');
      });
      root.addEventListener('drop', (ev) => {
        const th = ev.target.closest('th[data-col]');
        if (!th || !dragColId) return;
        ev.preventDefault();
        const toId = th.getAttribute('data-col');
        th.classList.remove('drag-over');
        if (moveCol(dragColId, toId)) {
          suppressSortClick = true;
          renderColPanel();
          if (cacheRows.length) render(cacheRows);
        }
        dragColId = null;
      });
    }

    async function loadData() {
      const btn = document.getElementById('btnRefresh');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = '加载中…';
      try {
        let data;
        if (historyMode) {
          const res = await fetch(
            '/api/zt/history/day?date=' + encodeURIComponent(historyDate) +
              '&pool=' + encodeURIComponent(pool.id),
            { cache: 'no-store' }
          );
          data = await res.json();
          if (!data.ok) throw new Error(data.error || '历史快照不存在');
          historyPlateMap = {};
          for (const t of data.themes || []) {
            if (t && t.plate_id != null) historyPlateMap[String(t.plate_id)] = t;
          }
          const cap = data.captured_at
            ? new Date(Number(data.captured_at) * 1000).toLocaleString()
            : '';
          document.getElementById('histCaptured').textContent = cap ? '落库 ' + cap : '';
        } else {
          const res = await fetch('/api/zt/pool?pool=' + encodeURIComponent(pool.id), { cache: 'no-store' });
          data = await res.json();
          historyPlateMap = {};
        }
        if (!data.ok) throw new Error(data.error || '加载失败');
        cacheRows = data.items || data.stocks || [];
        render(cacheRows);
        status.textContent = historyMode
          ? pool.short + ' ' + cacheRows.length + ' 只 · 快照 ' + historyDate
          : pool.short + ' ' + cacheRows.length + ' 只 · ' + new Date().toLocaleTimeString();
      } catch (e) {
        status.textContent = '失败: ' + (e.message || e);
        document.getElementById('root').innerHTML =
          '<div class="err">' + esc(e.message || e) + '</div>';
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('histModalClose').addEventListener('click', () => {
      document.getElementById('histModalBg').classList.remove('open');
    });
    document.getElementById('histModalBg').addEventListener('click', (ev) => {
      if (ev.target === document.getElementById('histModalBg')) {
        document.getElementById('histModalBg').classList.remove('open');
      }
    });

    document.getElementById('btnRefresh').addEventListener('click', loadData);
    document.getElementById('btnCollapseToggle').addEventListener('click', toggleCollapseAllGroups);
    document.getElementById('stats').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-filter]');
      if (!btn) return;
      const mode = btn.getAttribute('data-filter');
      if (!mode) return;
      if (mode === 'all' || filterMode === mode) filterMode = null;
      else filterMode = mode;
      if (cacheRows.length) render(cacheRows);
    });
    document.getElementById('chkPrimary').addEventListener('change', () => {
      if (cacheRows.length) render(cacheRows);
    });
    document.getElementById('btnCols').addEventListener('click', () => {
      document.getElementById('colPanel').classList.toggle('open');
    });
    document.getElementById('btnColClose').addEventListener('click', () => {
      document.getElementById('colPanel').classList.remove('open');
    });
    document.getElementById('btnColAll').addEventListener('click', () => {
      for (const c of COLS) visibility[c.id] = true;
      saveVisibility(visibility);
      renderColPanel();
      if (cacheRows.length) render(cacheRows);
    });
    document.getElementById('btnColNone').addEventListener('click', () => {
      for (const c of COLS) visibility[c.id] = !!c.fixed;
      saveVisibility(visibility);
      renderColPanel();
      if (cacheRows.length) render(cacheRows);
    });
    document.getElementById('btnColDefault').addEventListener('click', () => {
      visibility = defaultVisibility();
      colOrder = defaultOrder();
      sortState = { ...DEFAULT_SORT, active: false };
      saveVisibility(visibility);
      saveOrder(colOrder);
      saveSort(sortState);
      renderColPanel();
      if (cacheRows.length) render(cacheRows);
    });
    document.getElementById('colGrid').addEventListener('change', (ev) => {
      const input = ev.target;
      if (!(input instanceof HTMLInputElement) || !input.dataset.col) return;
      const id = input.dataset.col;
      const col = COL_BY_ID[id];
      if (!col || col.fixed) return;
      visibility[id] = input.checked;
      saveVisibility(visibility);
      if (cacheRows.length) render(cacheRows);
    });

    // 列面板拖拽改序
    const colGrid = document.getElementById('colGrid');
    colGrid.addEventListener('dragstart', (ev) => {
      const item = ev.target.closest('.col-item[data-col]');
      if (!item) return;
      dragColId = item.getAttribute('data-col');
      try { ev.dataTransfer.setData('text/plain', dragColId); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
    });
    colGrid.addEventListener('dragend', () => {
      dragColId = null;
      colGrid.querySelectorAll('.col-item.drag-over').forEach((el) => el.classList.remove('drag-over'));
    });
    colGrid.addEventListener('dragover', (ev) => {
      const item = ev.target.closest('.col-item[data-col]');
      if (!item || !dragColId) return;
      ev.preventDefault();
      colGrid.querySelectorAll('.col-item.drag-over').forEach((el) => {
        if (el !== item) el.classList.remove('drag-over');
      });
      item.classList.add('drag-over');
    });
    colGrid.addEventListener('drop', (ev) => {
      const item = ev.target.closest('.col-item[data-col]');
      if (!item || !dragColId) return;
      ev.preventDefault();
      const toId = item.getAttribute('data-col');
      item.classList.remove('drag-over');
      if (moveCol(dragColId, toId)) {
        renderColPanel();
        if (cacheRows.length) render(cacheRows);
      }
      dragColId = null;
    });

    renderColPanel();
    bindRootInteractions();
    startPlatePolling();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshPlateStats();
    });
    loadData();
  </script>
</body>
</html>
