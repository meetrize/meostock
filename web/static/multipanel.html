<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多面板 K 线 · mootdx</title>
  <script src="/static/klinecharts.min.js"></script>
  <style>
    :root,
    html[data-theme="light"] {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --header-top: #ffffff;
      --header-bottom: #f7f9fb;
      --line: #d8dee6;
      --mp-gutter: #c5ced8;
      --text: #1a2332;
      --muted: #6b7785;
      --input-bg: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover: #c5ced8;
      --btn-active-bg: #e8f1ff;
      --status-bg: rgba(255, 255, 255, 0.92);
      --modal-bg: #ffffff;
      --modal-mask: rgba(15, 23, 42, 0.35);
      --up: #e53935;
      --down: #00897b;
      --accent: #2f6fed;
      --font: "IBM Plex Sans", "PingFang SC", "Helvetica Neue", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    }

    html[data-theme="dark"] {
      --bg: #0f1419;
      --panel: #171d25;
      --header-top: #1a222c;
      --header-bottom: #171d25;
      --line: #2a3441;
      --mp-gutter: #2a3441;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --input-bg: #0c1015;
      --btn-bg: #121820;
      --btn-hover: #3a4a5c;
      --btn-active-bg: #1a2a40;
      --status-bg: rgba(15, 20, 25, 0.85);
      --modal-bg: #1b2330;
      --modal-mask: rgba(0, 0, 0, 0.55);
      --up: #ef5350;
      --down: #26a69a;
      --accent: #3d8bfd;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .mp-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: linear-gradient(180deg, var(--header-top), var(--header-bottom));
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .mp-bar .title { font-weight: 600; margin-right: 4px; }
    .mp-bar .spacer { flex: 1; }
    .mp-bar .muted { color: var(--muted); font-size: 12px; }
    .mp-pager {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }
    .mp-pager button {
      min-width: 28px;
      padding: 4px 8px !important;
      font-size: 14px !important;
      line-height: 1;
    }
    .mp-pager button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .mp-pager #pageLabel {
      min-width: 3.2em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .mp-bar a,
    .mp-bar button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .mp-bar a:hover,
    .mp-bar button:hover:not(:disabled) {
      background: var(--btn-active-bg);
      border-color: var(--accent);
    }
    .mp-bar select {
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 3px 6px;
      font: inherit;
      font-size: 12px;
    }

    .mp-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 1px;
      background: var(--mp-gutter);
    }
    .mp-bar input[type="number"] {
      width: 44px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 3px 4px;
      font: inherit;
      font-size: 12px;
    }

    .mp-cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      overflow: hidden;
    }
    .mp-cell .chart-host {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .mp-cell.is-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }
    .mp-cell.is-active {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
      z-index: 1;
    }

    /* —— 叠在图上的浮层（名称/代码/行情），MA 通过 candle.tooltip.offsetTop 下移 —— */
    .mp-chrome {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 4px 8px;
    }
    .mp-id {
      max-width: calc(100% - 44px);
      pointer-events: auto; /* 名称/代码可点；勿 none，否则部分浏览器点不透到按钮 */
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      z-index: 6;
      position: relative;
    }
    .mp-id-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mp-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      pointer-events: auto; /* chrome 整体 none，名称可点开单图 */
    }
    .mp-name:hover {
      color: var(--accent, #2f6fed);
      text-decoration: underline;
    }
    .mp-code {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--muted);
      cursor: pointer;
      pointer-events: auto;
    }
    .mp-code:hover {
      color: var(--accent, #2f6fed);
      text-decoration: underline;
    }
    .mp-quote {
      margin-top: 2px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      line-height: 1.2;
    }
    .mp-quote.up { color: var(--up); }
    .mp-quote.down { color: var(--down); }

    .mp-chrome-actions {
      position: relative;
      pointer-events: auto;
      flex: 0 0 auto;
    }
    .mp-gear {
      appearance: none;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--status-bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .mp-gear:hover {
      border-color: var(--accent);
      background: var(--btn-active-bg);
    }

    .mp-menu {
      position: absolute;
      top: 32px;
      right: 0;
      width: min(300px, 92vw);
      max-height: min(72vh, 280px);
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--modal-bg);
      border: 1px solid var(--line);
      border-radius: 5px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      padding: 4px;
      z-index: 20;
      box-sizing: border-box;
    }
    .mp-menu[hidden] { display: none !important; }
    .mp-menu-sec {
      margin-bottom: 3px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--line);
    }
    .mp-menu-sec:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .mp-menu-sec-lock {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .mp-menu-sec-lock .mp-menu-btn {
      width: auto;
      flex: 1 1 auto;
      font-size: 10px;
      padding: 1px 5px;
    }
    .mp-menu-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
      line-height: 1.2;
    }
    /* 周期：强制单行 */
    .mp-period-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 2px;
      width: 100%;
    }
    .mp-period-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--text);
      border-radius: 3px;
      padding: 1px 0;
      font: inherit;
      font-size: 10px;
      line-height: 1.35;
      cursor: pointer;
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
    }
    .mp-period-btn.active,
    .mp-period-btn:hover {
      background: var(--btn-active-bg);
      border-color: var(--accent);
      color: var(--accent);
    }
    /* 通用单行：图形 / 隐轴 / 指标 / MA / 设置；代码 / 换 / 单图 */
    .mp-menu-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;
      width: 100%;
    }
    .mp-menu-select,
    .mp-symbol-input {
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 3px;
      padding: 1px 4px;
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
      box-sizing: border-box;
      min-width: 0;
    }
    .mp-menu-select-compact {
      flex: 1 1 72px;
      width: auto;
      max-width: 110px;
    }
    .mp-symbol-input {
      flex: 1 1 auto;
      width: auto;
    }
    .mp-menu-check {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .mp-menu-check input { margin: 0; }
    .mp-menu-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--text);
      border-radius: 3px;
      padding: 1px 5px;
      font: inherit;
      font-size: 10px;
      line-height: 1.35;
      cursor: pointer;
      flex: 0 0 auto;
      width: auto;
      white-space: nowrap;
    }
    .mp-menu-btn:hover {
      background: var(--btn-active-bg);
      border-color: var(--accent);
    }
    .mp-menu-btn.mp-menu-btn-block { width: 100%; }
    .mp-menu-link {
      display: inline-block;
      font-size: 10px;
      color: var(--accent);
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.3;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .mp-menu-link:hover { text-decoration: underline; }

    /* —— 设置弹层 —— */
    .mp-modal-mask {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--modal-mask);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .mp-modal-mask.show { display: flex; }
    .mp-modal {
      width: min(360px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: var(--modal-bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .mp-modal-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      font-size: 13px;
    }
    .mp-modal-x {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .mp-modal-bd { padding: 8px 10px; }
    .mp-setting-grid {
      display: grid;
      gap: 5px;
    }
    .mp-setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      line-height: 1.25;
      min-height: 22px;
    }
    .mp-setting-item select {
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 3px;
      padding: 2px 5px;
      font: inherit;
      font-size: 11px;
      min-width: 100px;
    }
    .mp-setting-item input[type="checkbox"] { margin: 0; }
    .mp-setting-checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px 8px;
      padding-top: 2px;
    }
    .mp-setting-check {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      line-height: 1.25;
      cursor: pointer;
      min-width: 0;
    }
    .mp-setting-check input { margin: 0; flex: 0 0 auto; }
    .mp-setting-status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .mp-setting-status-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }
    .mp-setting-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      cursor: default;
    }
    .mp-setting-status-ctrls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mp-setting-status-ctrls input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
    }
    .mp-setting-note {
      margin: 8px 0 0;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.35;
    }
    .mp-modal-ft {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 5px;
      padding: 7px 10px;
      border-top: 1px solid var(--line);
    }
    .mp-modal-ft button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--text);
      border-radius: 3px;
      padding: 3px 9px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .mp-modal-ft button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .mp-modal-wide { width: min(420px, 100%); }
    .mp-ind-section { margin-bottom: 8px; }
    .mp-ind-section:last-child { margin-bottom: 0; }
    .mp-ind-section h4 {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .mp-ind-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px 6px;
    }
    .mp-ind-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 1px 0;
      font-size: 11px;
      line-height: 1.25;
      cursor: pointer;
      min-width: 0;
    }
    .mp-ind-item input { margin: 0; flex: 0 0 auto; }
    .mp-ind-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mp-bar-check {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    /* 顶栏设置菜单 */
    .mp-bar-settings {
      position: relative;
      flex: 0 0 auto;
    }
    .mp-bar-settings > summary {
      list-style: none;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .mp-bar-settings > summary::-webkit-details-marker { display: none; }
    .mp-bar-settings > summary:hover,
    .mp-bar-settings[open] > summary {
      background: var(--btn-active-bg);
      border-color: var(--accent);
    }
    .mp-bar-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 60;
      width: min(320px, calc(100vw - 24px));
      max-height: min(70vh, 420px);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--modal-bg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mp-bar-menu-sec {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .mp-bar-menu-sec:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }
    .mp-bar-menu-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .mp-bar-menu-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    .mp-bar-menu-row label.muted {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mp-bar-menu .mp-bar-check {
      min-width: 42%;
      flex: 1 1 42%;
    }

    /* 面板涨停主题行 */
    .mp-zt-reason {
      display: none;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 120px;
      max-width: 100%;
      pointer-events: auto;
    }
    .mp-zt-reason.is-on { display: inline-flex; }
    .mp-zt-theme {
      flex: 0 0 auto;
      max-width: 7em;
      padding: 0 6px;
      border-radius: 3px;
      border: 1px solid color-mix(in srgb, var(--up) 45%, var(--line));
      background: color-mix(in srgb, var(--up) 14%, transparent);
      color: var(--up);
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: default;
    }
    .mp-zt-drive,
    .mp-zt-stock {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      line-height: 1.2;
      color: var(--muted);
      cursor: default;
    }
    .mp-zt-drive { flex: 0 1 12em; max-width: 12em; }
    .mp-zt-stock { flex: 1 1 8em; }

    .mp-zt-tip {
      position: fixed;
      z-index: 1200;
      width: min(360px, calc(100vw - 16px));
      max-height: min(50vh, 320px);
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--modal-bg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      font-size: 12px;
      color: var(--text);
      pointer-events: none;
    }
    .mp-zt-tip[hidden] { display: none !important; }
    .mp-zt-tip-hd {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .mp-zt-tip-row {
      padding: 6px 0;
      border-top: 1px solid var(--line);
    }
    .mp-zt-tip-row:first-of-type { border-top: none; padding-top: 0; }
    .mp-zt-tip-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }
    .mp-zt-tip-pool-up { color: var(--up); font-weight: 600; font-size: 11px; }
    .mp-zt-tip-pool-dn { color: var(--down); font-weight: 600; font-size: 11px; }
    .mp-zt-tip-theme { color: var(--text); font-weight: 600; }
    .mp-zt-tip-body { color: var(--muted); line-height: 1.35; word-break: break-word; }
    .mp-zt-tip-empty { color: var(--muted); padding: 8px 0; }

    .app.bar-hidden .mp-bar { display: none; }
    .mp-show-bar {
      display: none;
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 50;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--status-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .app.bar-hidden .mp-show-bar { display: block; }

    .mp-status {
      flex: 0 0 auto;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      background: var(--status-bg);
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="mp-bar">
      <span class="title">多面板</span>
      <span class="mp-pager" id="mpPager" title="标的翻页（↓下一页 · ↑上一页）">
        <button type="button" id="btnPagePrev" title="上一页 (↑)">‹</button>
        <span class="muted" id="pageLabel">1/1</span>
        <button type="button" id="btnPageNext" title="下一页 (↓)">›</button>
      </span>
      <span class="muted" id="mpHint">—</span>
      <span class="spacer"></span>
      <details class="mp-bar-settings" id="barSettings">
        <summary title="布局 / 周期 / 同步 / 涨停主题">设置</summary>
        <div class="mp-bar-menu" role="menu" aria-label="多面板设置">
          <div class="mp-bar-menu-sec">

  <script type="module">
    import { isValidPeriod } from "/static/kline/period.mjs";
    import { getKlineData } from "/static/kline/data.mjs";
    import { THEME_KEY, CANDLE_TYPES } from "/static/kline/styles.mjs";
    import { createPool } from "/static/kline/pool.mjs";
    import { ChartPanel } from "/static/kline/ChartPanel.mjs?v=zt2";
    import {
      setZtReasonDisplay,
      refreshChromeForPanels,
    } from "/static/kline/chrome.mjs?v=zt2";
    import {
      LAYOUT_PRESETS,
      resolveLayout,
      applyLayoutToGrid,
      cellAreaStyle,
      loadCustomLayouts,
      upsertCustomLayout,
      clampDim,
    } from "/static/kline/layout.mjs";
    import { loadSession, saveSession } from "/static/kline/store.mjs";

    const DEFAULT_SYMBOLS = ["600036", "000001", "510300", "sh000001", "300750", "601318"];
    const BAR_PREFS_KEY = "multipanel-bar-prefs";

    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("mpHint");
    const gridEl = document.getElementById("mpGrid");
    const periodSel = document.getElementById("globalPeriod");
    const candleSel = document.getElementById("globalCandle");
    const layoutSel = document.getElementById("layoutSel");
    const customMask = document.getElementById("customLayoutMask");
    const barSettingsEl = document.getElementById("barSettings");
    const showZtReasonEl = document.getElementById("showZtReason");

    // 填充图形下拉（与 styles.CANDLE_TYPES 对齐）
    candleSel.innerHTML = CANDLE_TYPES.map(
      (t) => `<option value="${t.value}">${t.label}</option>`
    ).join("");
    candleSel.value = "candle_solid";

    /** @type {(ChartPanel|null)[]} 与格子下标对齐 */
    let slotPanels = [];
    /** 完整标的列表（可跨多页）；当前页切片填入格子 */
    /** @type {string[]} */
    let allSymbols = [];
    /** @type {string[]} 当前页展示用（兼容旧逻辑里的 symbols） */
    let symbols = [];
    /** @type {string[]} 与 allSymbols 对齐的锚定日 */
    let allDates = [];
    /** left = 命中日偏左看右侧 */
    let focusBias = "";
    /** 0-based 页码 */
    let pageIndex = 0;
    let currentLayout = resolveLayout("2x2");
    let currentPeriod = "1d";
    let syncCrosshairOn = false;
    let syncZoomOn = false;
    let syncPanOn = false;
    const pageLabelEl = document.getElementById("pageLabel");
    const btnPagePrev = document.getElementById("btnPagePrev");
    const btnPageNext = document.getElementById("btnPageNext");
    /** 全体隐藏量能（未 volumeLocked 的面板跟随） */
    let hideVolGlobal = false;
    /** 全体隐藏 Y 轴（未 yAxisLocked 的面板跟随） */
    let hideYAxisGlobal = false;
    /** 全体隐藏主图 MA（未 maLocked 的面板跟随） */
    let hideMaGlobal = false;
    /** 最近一次会话里的面板快照，用于重建时恢复 withVolume 等 */
    let savedPanelStates = [];

    // 首屏读缓存可高并发；后台 force 拉网限流，避免把接口打爆
    const schedule = createPool(8);
    const scheduleRefresh = createPool(2);
    const data = getKlineData();
    const appEl = document.querySelector(".app");
    const syncCrosshairEl = document.getElementById("syncCrosshair");
    const syncZoomEl = document.getElementById("syncZoom");
    const syncPanEl = document.getElementById("syncPan");
    const hideVolEl = document.getElementById("hideVol");
    const hideYAxisEl = document.getElementById("hideYAxis");
    const hideMaEl = document.getElementById("hideMa");

    /** 当日涨停主题 map：6位码 → { theme, drive, reason } */
    let ztReasonByCode = {};
    let showZtReasonOn = false;
    let ztPoolLoading = false;

    function livePanels() {
      return slotPanels.filter(Boolean);
    }

    function pureAshareCode(raw) {
      const s = String(raw ?? "").trim();
      const m = s.match(/(\d{6})/);
      return m ? m[1] : "";
    }

    function loadBarPrefs() {
      try {
        const raw = localStorage.getItem(BAR_PREFS_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        return data && typeof data === "object" ? data : {};
      } catch (_) {
        return {};
      }
    }

    function saveBarPrefs(patch) {
      try {
        const next = { ...loadBarPrefs(), ...(patch || {}) };
        localStorage.setItem(BAR_PREFS_KEY, JSON.stringify(next));
      } catch (_) {}
    }

    function applyZtReasonToChrome() {
      setZtReasonDisplay({
        enabled: showZtReasonOn,
        byCode: ztReasonByCode,
      });
      refreshChromeForPanels(livePanels());
    }

    function parseLimitPoolItems(payload) {
      if (!payload || typeof payload !== "object") return [];
      if (Array.isArray(payload.items)) return payload.items;
      if (Array.isArray(payload.data)) return payload.data;
      if (Array.isArray(payload.stocks)) return payload.stocks;
      return [];
    }

    async function fetchZtReasonMap() {
      const out = {};
      try {
        const res = await fetch("/api/zt/pool?pool=limit_up", { cache: "no-store" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.ok) return out;
        for (const raw of parseLimitPoolItems(data)) {
          if (!raw || typeof raw !== "object") continue;
          const code = pureAshareCode(raw.symbol ?? raw.code);
          if (!code || code.length !== 6) continue;
          const surge =
            raw.surge_reason && typeof raw.surge_reason === "object"
              ? raw.surge_reason
              : null;
          const platesRaw = Array.isArray(surge?.related_plates)
            ? surge.related_plates
            : [];
          let theme = "";
          let drive = "";
          for (const p of platesRaw) {
            if (!p || typeof p !== "object") continue;
            const name = String(p.plate_name || "").trim();
            if (!name) continue;
            theme = name;
            drive = String(p.plate_reason || "").trim();
            break;
          }
          const reason = String(surge?.stock_reason || "").trim();
          if (!theme && !drive && !reason) continue;
          out[code] = { theme, drive, reason };
        }
      } catch (_) {}
      return out;
    }

    async function ensureZtReasonMap(force = false) {
      if (!showZtReasonOn) {
        ztReasonByCode = {};
        applyZtReasonToChrome();
        return;
      }
      if (ztPoolLoading) return;
      if (!force && Object.keys(ztReasonByCode).length) {
        applyZtReasonToChrome();
        return;
      }
      ztPoolLoading = true;
      try {
        ztReasonByCode = await fetchZtReasonMap();
        applyZtReasonToChrome();
        const n = Object.keys(ztReasonByCode).length;
        setStatus(n ? `涨停主题已加载 ${n} 只` : "今日涨停池暂无主题数据");
      } finally {
        ztPoolLoading = false;
      }
    }

    // 设置菜单：点外部关闭（保留 summary 点击切换）
    document.addEventListener("click", (e) => {
      if (!barSettingsEl?.open) return;
      if (barSettingsEl.contains(e.target)) return;
      barSettingsEl.open = false;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && barSettingsEl?.open) barSettingsEl.open = false;
    });

    function handleCrosshair(data, sourcePanel) {
      if (!syncCrosshairOn) return;
      const payload = ChartPanel.extractCrosshairPayload(data, sourcePanel.chart);
      if (!payload) return;
      livePanels().forEach((p) => {
        if (p === sourcePanel) return;
        p.syncCrosshairFrom(payload);
      });
    }

    function handleTimeScaleSync(payload, sourcePanel) {
      if ((!syncZoomOn && !syncPanOn) || !payload) return;
      livePanels().forEach((p) => {
        if (p === sourcePanel) return;
        p.syncTimeScaleFrom(payload, { zoom: syncZoomOn, pan: syncPanOn });
      });
    }

    function setBarHidden(hidden) {
      appEl.classList.toggle("bar-hidden", !!hidden);
      try {
        const s = loadSession() || {};
        s.hideGlobalBar = !!hidden;
        saveSession(s);
      } catch (_) {}
      // 顶栏显隐后重算高度
      requestAnimationFrame(() => livePanels().forEach((p) => p.resize()));
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function applyTheme(theme) {
      const t = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      try {
        localStorage.setItem(THEME_KEY, t);
      } catch (_) {}
      livePanels().forEach((p) => p.refreshTheme());
    }

    (function initTheme() {
      let t = "light";
      try {
        t = localStorage.getItem(THEME_KEY) || "light";
      } catch (_) {}
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();

    function refreshLayoutSelect(selectedId) {
      const customs = loadCustomLayouts();
      layoutSel.innerHTML = "";
      const g1 = document.createElement("optgroup");
      g1.label = "预设";
      LAYOUT_PRESETS.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.label}（${p.slots}）`;
        g1.appendChild(opt);
      });
      layoutSel.appendChild(g1);
      if (customs.length) {
        const g2 = document.createElement("optgroup");
        g2.label = "我的布局";
        customs.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = `${c.name}（${c.rows}×${c.cols}）`;
          g2.appendChild(opt);
        });
        layoutSel.appendChild(g2);
      }
      const id = selectedId || currentLayout.id;
      if ([...layoutSel.options].some((o) => o.value === id)) {
        layoutSel.value = id;
      } else {
        layoutSel.value = "2x2";
      }
    }

    function readPasteSymbolsFromStorage() {
      try {
        const raw = sessionStorage.getItem("mp_symbols");
        if (!raw) return [];
        const data = JSON.parse(raw);
        sessionStorage.removeItem("mp_symbols");
        if (!Array.isArray(data)) return [];
        return data.map((s) => String(s || "").trim()).filter(Boolean);
      } catch (_) {
        return [];
      }
    }

    function fetchNavPayloadSync(navId) {
      const nid = String(navId || "").trim();
      if (!nid) return null;
      try {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/kline-nav/" + encodeURIComponent(nid), false);
        xhr.send(null);
        if (xhr.status < 200 || xhr.status >= 300) return null;
        const data = JSON.parse(xhr.responseText || "{}");
        if (!data?.ok || !Array.isArray(data.symbols)) return null;
        const symbols = data.symbols.map((s) => String(s || "").trim()).filter(Boolean);
        const rawDates = Array.isArray(data.dates) ? data.dates : [];
        const dates = symbols.map((_, i) => {
          const d = String(rawDates[i] || "").trim().slice(0, 10);
          return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
        });
        return { symbols, dates };
      } catch (_) {
        return null;
      }
    }

    function parseQuery() {
      const params = new URLSearchParams(location.search);
      let qSymbols = String(params.get("symbols") || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      let qDates = String(params.get("dates") || "")
        .split(",")
        .map((s) => s.trim().slice(0, 10));
      // 长列表交接：URL 带 from=paste 时优先读 sessionStorage
      if (params.get("from") === "paste") {
        const stored = readPasteSymbolsFromStorage();
        if (stored.length) qSymbols = stored;
      }
      const navId = String(params.get("nav") || "").trim();
      const bias = String(params.get("bias") || "").trim().toLowerCase() === "left" ? "left" : "";
      // 无 symbols 或被截断时，用服务端短时 nav 补全
      if (navId && (qSymbols.length < 2 || !qDates.some((d) => /^\d{4}-\d{2}-\d{2}$/.test(d)))) {
        const fromNav = fetchNavPayloadSync(navId);
        if (fromNav?.symbols?.length) {
          if (qSymbols.length < 2) qSymbols = fromNav.symbols;
          if (fromNav.dates.some(Boolean)) {
            qDates = fromNav.dates.slice(0, qSymbols.length);
          }
        }
      }
      while (qDates.length < qSymbols.length) qDates.push("");
      qDates = qDates.slice(0, qSymbols.length).map((d) =>
        /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : ""
      );
      let period = params.get("period") || "";
      let layoutId = params.get("layout") || "";
      // page 支持 1-based（URL）或 0-based 容错
      const rawPage = Number(params.get("page") || "0");
      let page = 0;
      if (Number.isFinite(rawPage) && rawPage >= 1) page = Math.floor(rawPage) - 1;
      else if (Number.isFinite(rawPage) && rawPage >= 0) page = Math.floor(rawPage);
      return { qSymbols, qDates, period, layoutId, page, navId, bias };
    }

    /** 多面板 → 单图：按当前完整列表写 nav，便于 ↑↓ 翻页 */
    function openSingleKlineFromPanel(panel) {
      const code = String(panel?.symbol || "").trim();
      if (!code) return;
      const list = (allSymbols || []).map((s) => String(s || "").trim()).filter(Boolean);
      const period = panel.period || currentPeriod || "1d";
      const qs = new URLSearchParams({ symbol: code, period });
      let absIndex = allSymbols.indexOf(code);
      if (absIndex < 0) absIndex = 0;
      const focusDate =
        String(panel?.focusDate || allDates[absIndex] || "").trim().slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(focusDate)) qs.set("date", focusDate);
      if (focusBias === "left" || panel?.focusBias === "left") qs.set("bias", "left");
      let navId = "";
      let index = 0;
      if (list.length >= 2) {
        navId =
          "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        index = list.indexOf(code);
        if (index < 0) index = 0;
        const dateList = list.map((sym) => {
          const i = allSymbols.indexOf(sym);
          const d = String(allDates[i] || "").trim().slice(0, 10);
          return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
        });
        const payloadObj = {
          v: 1,
          symbols: list,
          i: index,
          ts: Date.now(),
        };
        if (dateList.some(Boolean)) payloadObj.dates = dateList;
        const payload = JSON.stringify(payloadObj);
        // 先同步写 LS（快），再立刻 open——同步 XHR 会吃掉用户手势导致弹窗被拦
        try {
          localStorage.setItem("kline_nav_" + navId, payload);
        } catch (_) {}
        qs.set("nav", navId);
      }
      const url = location.origin + "/?" + qs.toString();
      // noopener 下 open 常返回 null，不能据此 location.href，否则本页也会跳走
      window.open(url, "_blank", "noopener");
      if (navId) {
        try {
          const body = { id: navId, symbols: list, i: index };
          const dateList = list.map((sym) => {
            const i = allSymbols.indexOf(sym);
            const d = String(allDates[i] || "").trim().slice(0, 10);
            return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
          });
          if (dateList.some(Boolean)) body.dates = dateList;
          void fetch("/api/kline-nav", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            keepalive: true,
          });
        } catch (_) {}
      }
    }

    function pageSize() {
      return Math.max(1, currentLayout?.slots || 4);
    }

    function totalPages() {
      const n = Math.max(allSymbols.length, 1);
      return Math.max(1, Math.ceil(n / pageSize()));
    }

    function clampPage(p) {
      return Math.max(0, Math.min(totalPages() - 1, p | 0));
    }

    /** 当前页切片（不足一页用空串补齐格子，不拿默认股填） */
    function pageSlice(page = pageIndex) {
      const size = pageSize();
      const start = page * size;
      const slice = allSymbols.slice(start, start + size);
      while (slice.length < size) slice.push("");
      return slice;
    }

    function updatePagerUI() {
      const pages = totalPages();
      pageIndex = clampPage(pageIndex);
      if (pageLabelEl) pageLabelEl.textContent = `${pageIndex + 1}/${pages}`;
      if (btnPagePrev) btnPagePrev.disabled = pageIndex <= 0;
      if (btnPageNext) btnPageNext.disabled = pageIndex >= pages - 1;
      const filled = allSymbols.filter(Boolean).length;
      if (hintEl && currentLayout) {
        const n = livePanels().length;
        hintEl.textContent = `${currentLayout.label} · ${currentPeriod} · ${n}/${pageSize()} 图 · 共 ${filled} 只`;
      }
    }

    /** 把当前页格子里的代码写回 allSymbols */
    function syncPageIntoAllSymbols() {
      const size = pageSize();
      const start = pageIndex * size;
      for (let i = 0; i < size; i++) {
        const sym = slotPanels[i]?.symbol || symbols[i] || "";
        const idx = start + i;
        while (allSymbols.length <= idx) allSymbols.push("");
        allSymbols[idx] = sym;
      }
      // 去掉尾部空串，但至少保留一页长度占位避免页码抖动
      while (allSymbols.length > size && !allSymbols[allSymbols.length - 1]) {
        allSymbols.pop();
      }
      if (!allSymbols.length) allSymbols = [""];
    }

    function syncUrl() {
      const url = new URL(location.href);
      url.searchParams.set("layout", currentLayout.id);
      url.searchParams.set("period", currentPeriod);
      if (pageIndex > 0) url.searchParams.set("page", String(pageIndex + 1));
      else url.searchParams.delete("page");
      const filled = allSymbols.filter(Boolean);
      if (filled.length) url.searchParams.set("symbols", filled.join(","));
      else url.searchParams.delete("symbols");
      history.replaceState(null, "", url);
    }

    function persistSession() {
      syncPageIntoAllSymbols();
      symbols = pageSlice();
      const panels = slotPanels.map((p, i) => {
        if (!p) {
          return {
            symbol: symbols[i] || "",
            period: currentPeriod,
            withVolume: !hideVolGlobal,
            withMa: !hideMaGlobal,
            hideYAxis: hideYAxisGlobal,
          };
        }
        const st = p.getState();
        return {
          symbol: st.symbol,
          period: st.period,
          settings: st.settings,
          periodLocked: st.periodLocked,
          chartTypeLocked: st.chartTypeLocked,
          withVolume: st.withVolume,
          volumeLocked: st.volumeLocked,
          withMa: st.withMa,
          maLocked: st.maLocked,
          yAxisLocked: st.yAxisLocked,
          hideYAxis: st.hideYAxis,
        };
      });
      savedPanelStates = panels;
      saveSession({
        layoutId: currentLayout.id,
        period: currentPeriod,
        symbols: allSymbols.slice(),
        pageIndex,
        syncCrosshair: syncCrosshairOn,
        syncZoom: syncZoomOn,
        syncPan: syncPanOn,
        hideVol: hideVolGlobal,
        hideYAxis: hideYAxisGlobal,
        hideMa: hideMaGlobal,
        hideGlobalBar: appEl.classList.contains("bar-hidden"),
        panels,
      });
    }

    function goPage(nextPage, { rebuild = true } = {}) {
      syncPageIntoAllSymbols();
      const target = clampPage(nextPage);
      if (target === pageIndex && rebuild) {
        updatePagerUI();
        return;
      }
      pageIndex = target;
      // 翻页后格子对应新标的，不沿用上一页的单格锁定态
      savedPanelStates = [];
      if (rebuild) {
        buildGrid(currentLayout, currentPeriod, pageSlice());
        loadAll();
      }
      updatePagerUI();
      syncUrl();
      persistSession();
      setStatus(`第 ${pageIndex + 1}/${totalPages()} 页`);
    }

    function buildGrid(layout, period, nextSymbols) {
      // nextSymbols 若传入完整列表则视为刷新 allSymbols；否则视为当前页切片
      if (Array.isArray(nextSymbols) && nextSymbols.length > layout.slots) {
        allSymbols = nextSymbols.map((s) => String(s || "").trim()).filter(Boolean);
        if (!allSymbols.length) allSymbols = DEFAULT_SYMBOLS.slice();
        pageIndex = clampPage(pageIndex);
      } else if (Array.isArray(nextSymbols) && nextSymbols.length && !allSymbols.length) {
        allSymbols = nextSymbols.map((s) => String(s || "").trim()).filter(Boolean);
      }

      currentLayout = layout;
      currentPeriod = period;
      pageIndex = clampPage(pageIndex);
      const merged = pageSlice();
      symbols = merged;

      livePanels().forEach((p) => {
        try {
          p.dispose();
        } catch (_) {}
      });
      slotPanels = Array(layout.slots).fill(null);
      gridEl.innerHTML = "";
      applyLayoutToGrid(gridEl, layout);

      for (let i = 0; i < layout.slots; i++) {
        const symbol = merged[i] || "";
        const cell = document.createElement("div");
        cell.className = "mp-cell";
        cell.dataset.slot = String(i);
        const area = cellAreaStyle(layout, i);
        if (area.gridArea) cell.style.gridArea = area.gridArea;
        gridEl.appendChild(cell);

        if (!symbol) {
          cell.classList.add("is-empty");
          cell.innerHTML = `<span>空面板 · 点击填代码</span>`;
          cell.addEventListener("click", () => {
            const code = prompt("输入股票代码", "");
            if (!code?.trim()) return;
            const abs = pageIndex * pageSize() + i;
            while (allSymbols.length <= abs) allSymbols.push("");
            allSymbols[abs] = code.trim();
            buildGrid(currentLayout, currentPeriod, pageSlice());
            loadAll();
            persistSession();
            syncUrl();
          });
          continue;
        }

        const saved = savedPanelStates[i] || {};
        const withVolume =
          typeof saved.withVolume === "boolean" ? saved.withVolume : !hideVolGlobal;
        const withMa =
          typeof saved.withMa === "boolean" ? saved.withMa : !hideMaGlobal;
        const hideYAxis =
          typeof saved.hideYAxis === "boolean"
            ? saved.hideYAxis
            : typeof saved.settings?.hideYAxis === "boolean"
              ? saved.settings.hideYAxis
              : hideYAxisGlobal;
        const absIdx = pageIndex * pageSize() + i;
        const focusDate = String(allDates[absIdx] || "").trim().slice(0, 10);
        const panel = new ChartPanel({
          container: cell,
          data,
          schedule,
          scheduleRefresh,
          symbol,
          period:
            saved.period && isValidPeriod(saved.period) ? saved.period : period,
          settings: { ...(saved.settings || {}), hideYAxis },
          withVolume,
          withMa,
          hideYAxis,
          periodLocked: !!saved.periodLocked,
          chartTypeLocked: !!saved.chartTypeLocked,
          volumeLocked: !!saved.volumeLocked,
          yAxisLocked: !!saved.yAxisLocked,
          maLocked: !!saved.maLocked,
          focusDate: /^\d{4}-\d{2}-\d{2}$/.test(focusDate) ? focusDate : "",
          focusBias: focusBias || "",
          onStatus: (msg) => setStatus(msg),
          onCrosshair: handleCrosshair,
          onTimeScaleSync: handleTimeScaleSync,
        });
        panel.onVolumeChange = () => persistSession();
        panel.onYAxisChange = () => persistSession();
        panel.onMaChange = () => persistSession();
        panel.onOpenSingle = openSingleKlineFromPanel;
        slotPanels[i] = panel;
      }

      updatePagerUI();
      refreshLayoutSelect(layout.id);
    }

    async function loadAll() {
      const list = livePanels();
      setStatus(`加载 ${list.length} 个面板…`);
      await Promise.all(list.map((p) => p.load()));
      setStatus(
        `已加载 ${list.length} 面板 · ${currentLayout.label} · 第 ${pageIndex + 1}/${totalPages()} 页`
      );
      persistSession();
      updatePagerUI();
      if (showZtReasonOn) void ensureZtReasonMap(false);
      else applyZtReasonToChrome();
    }

    function applyLayoutId(layoutId) {
      syncPageIntoAllSymbols();
      const layout = resolveLayout(layoutId, loadCustomLayouts());
      // 换布局后尽量留在「能看到当前起始标的」的页
      const anchor = allSymbols[pageIndex * pageSize()] || allSymbols[0] || "";
      currentLayout = layout;
      if (anchor) {
        const idx = allSymbols.indexOf(anchor);
        pageIndex = idx >= 0 ? Math.floor(idx / pageSize()) : 0;
      } else {
        pageIndex = 0;
      }
      savedPanelStates = [];
      buildGrid(layout, currentPeriod, pageSlice());
      loadAll();
      syncUrl();
      persistSession();
    }

    document.getElementById("btnTheme").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    document.getElementById("btnReload").addEventListener("click", () => loadAll());

    btnPagePrev?.addEventListener("click", () => goPage(pageIndex - 1));
    btnPageNext?.addEventListener("click", () => goPage(pageIndex + 1));

    document.addEventListener("keydown", (e) => {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = String(e.target?.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select" || e.target?.isContentEditable) {
        return;
      }
      if (e.key === "ArrowDown" || e.key === "PageDown") {
        if (pageIndex < totalPages() - 1) {
          e.preventDefault();
          goPage(pageIndex + 1);
        }
      } else if (e.key === "ArrowUp" || e.key === "PageUp") {
        if (pageIndex > 0) {
          e.preventDefault();
          goPage(pageIndex - 1);
        }
      }
    });

    document.getElementById("btnHideBar").addEventListener("click", () => {
      setBarHidden(true);
    });
    document.getElementById("btnShowBar").addEventListener("click", () => {
      setBarHidden(false);
    });

    syncCrosshairEl.addEventListener("change", () => {
      syncCrosshairOn = !!syncCrosshairEl.checked;
      setStatus(syncCrosshairOn ? "已开启十字线同步" : "已关闭十字线同步");
      persistSession();
    });

    syncZoomEl.addEventListener("change", () => {
      syncZoomOn = !!syncZoomEl.checked;
      setStatus(syncZoomOn ? "已开启时间轴同步缩放" : "已关闭时间轴同步缩放");
      persistSession();
    });

    syncPanEl.addEventListener("change", () => {
      syncPanOn = !!syncPanEl.checked;
      setStatus(syncPanOn ? "已开启时间轴同步平移" : "已关闭时间轴同步平移");
      persistSession();
    });

    hideVolEl.addEventListener("change", () => {
      hideVolGlobal = !!hideVolEl.checked;
      const showVol = !hideVolGlobal;
      let skipped = 0;
      let applied = 0;
      livePanels().forEach((p) => {
        if (p.volumeLocked) {
          skipped += 1;
          return;
        }
        p.applyGlobalVolume(showVol);
        applied += 1;
      });
      setStatus(
        skipped
          ? `${hideVolGlobal ? "全体隐藏量能" : "全体显示量能"}（应用 ${applied}，锁定跳过 ${skipped}）`
          : hideVolGlobal
            ? "全体隐藏量能"
            : "全体显示量能"
      );
      savedPanelStates = slotPanels.map((p, i) => {
        if (!p) return savedPanelStates[i] || { withVolume: showVol };
        const st = p.getState();
        return {
          ...(savedPanelStates[i] || {}),
          withVolume: st.withVolume,
          volumeLocked: st.volumeLocked,
        };
      });
      persistSession();
    });

    hideYAxisEl.addEventListener("change", () => {
      hideYAxisGlobal = !!hideYAxisEl.checked;
      let skipped = 0;
      let applied = 0;
      livePanels().forEach((p) => {
        if (p.yAxisLocked) {
          skipped += 1;
          return;
        }
        p.applyGlobalHideYAxis(hideYAxisGlobal);
        applied += 1;
      });
      setStatus(
        skipped
          ? `${hideYAxisGlobal ? "全体隐藏Y轴" : "全体显示Y轴"}（应用 ${applied}，锁定跳过 ${skipped}）`
          : hideYAxisGlobal
            ? "全体隐藏Y轴 · 主图铺满"
            : "全体显示Y轴"
      );
      savedPanelStates = slotPanels.map((p, i) => {
        if (!p) {
          return savedPanelStates[i] || { hideYAxis: hideYAxisGlobal };
        }
        const st = p.getState();
        return {
          ...(savedPanelStates[i] || {}),
          hideYAxis: st.hideYAxis,
          yAxisLocked: st.yAxisLocked,
          settings: st.settings,
        };
      });
      persistSession();
    });

    hideMaEl.addEventListener("change", () => {
      hideMaGlobal = !!hideMaEl.checked;
      const showMa = !hideMaGlobal;
      let skipped = 0;
      let applied = 0;
      livePanels().forEach((p) => {
        if (p.maLocked) {
          skipped += 1;
          return;
        }
        p.applyGlobalMa(showMa);
        applied += 1;
      });
      setStatus(
        skipped
          ? `${hideMaGlobal ? "全体隐藏均线" : "全体显示均线"}（应用 ${applied}，锁定跳过 ${skipped}）`
          : hideMaGlobal
            ? "全体隐藏均线"
            : "全体显示均线"
      );
      savedPanelStates = slotPanels.map((p, i) => {
        if (!p) return savedPanelStates[i] || { withMa: showMa };
        const st = p.getState();
        return {
          ...(savedPanelStates[i] || {}),
          withMa: st.withMa,
          maLocked: st.maLocked,
        };
      });
      persistSession();
    });

    showZtReasonEl?.addEventListener("change", () => {
      showZtReasonOn = !!showZtReasonEl.checked;
      saveBarPrefs({ showZtReason: showZtReasonOn });
      void ensureZtReasonMap(true);
      setStatus(showZtReasonOn ? "已开启涨停主题" : "已关闭涨停主题");
    });

    periodSel.addEventListener("change", () => {
      currentPeriod = periodSel.value;
      let skipped = 0;
      livePanels().forEach((p) => {
        if (p.periodLocked) {
          skipped += 1;
          return;
        }
        p.applyGlobalPeriod(currentPeriod);
        p.load();
      });
      const n = livePanels().length;
      hintEl.textContent = `${currentLayout.label} · ${currentPeriod} · ${n}/${currentLayout.slots} 图`;
      setStatus(
        skipped
          ? `全体周期 → ${currentPeriod}（${skipped} 格已锁定跳过）`
          : `全体周期 → ${currentPeriod}`
      );
      syncUrl();
      persistSession();
    });

    candleSel.addEventListener("change", () => {
      const type = candleSel.value;
      let skipped = 0;
      let applied = 0;
      livePanels().forEach((p) => {
        if (p.chartTypeLocked) {
          skipped += 1;
          return;
        }
        // 分时格仍强制面积，不改 candleType 显示意义不大，但仍写入设置供切回 K 线用
        p.applyGlobalCandleType(type);
        applied += 1;
      });
      setStatus(
        skipped
          ? `全体图形 → ${type}（应用 ${applied}，锁定跳过 ${skipped}）`
          : `全体图形 → ${type}`
      );
      persistSession();
    });

    layoutSel.addEventListener("change", () => {
      applyLayoutId(layoutSel.value);
    });

    document.getElementById("btnCustomLayout").addEventListener("click", () => {
      if (barSettingsEl) barSettingsEl.open = false;
      customMask.classList.add("show");
    });
    const closeCustom = () => customMask.classList.remove("show");
    document.getElementById("customLayoutClose").addEventListener("click", closeCustom);
    document.getElementById("customLayoutCancel").addEventListener("click", closeCustom);
    customMask.addEventListener("click", (e) => {
      if (e.target === customMask) closeCustom();
    });
    document.getElementById("customLayoutOk").addEventListener("click", () => {
      const rows = clampDim(document.getElementById("customRows").value);
      const cols = clampDim(document.getElementById("customCols").value);
      const name = document.getElementById("customName").value;
      const item = upsertCustomLayout({ name, rows, cols });
      closeCustom();
      refreshLayoutSelect(item.id);
      applyLayoutId(item.id);
    });

    // —— 启动：URL > session > 默认 ——
    const {
      qSymbols,
      qDates,
      period: qPeriod,
      layoutId: qLayout,
      page: qPage,
      bias: qBias,
    } = parseQuery();
    const session = loadSession();
    currentPeriod =
      (qPeriod && isValidPeriod(qPeriod) && qPeriod) ||
      (session?.period && isValidPeriod(session.period) && session.period) ||
      "1d";
    periodSel.value = currentPeriod;
    focusBias = qBias || "";

    const layoutId = qLayout || session?.layoutId || "2x2";
    currentLayout = resolveLayout(layoutId, loadCustomLayouts());
    allSymbols = qSymbols.length
      ? qSymbols.slice()
      : Array.isArray(session?.symbols) && session.symbols.length
        ? session.symbols.slice()
        : DEFAULT_SYMBOLS.slice();
    allDates = qSymbols.length
      ? (qDates || []).slice(0, allSymbols.length)
      : [];
    while (allDates.length < allSymbols.length) allDates.push("");
    pageIndex = qSymbols.length
      ? clampPage(qPage || 0)
      : clampPage(
          Number.isFinite(Number(session?.pageIndex)) ? Number(session.pageIndex) : qPage || 0
        );

    syncCrosshairOn = !!session?.syncCrosshair;
    syncCrosshairEl.checked = syncCrosshairOn;
    syncZoomOn = !!session?.syncZoom;
    syncZoomEl.checked = syncZoomOn;
    syncPanOn = !!session?.syncPan;
    syncPanEl.checked = syncPanOn;
    hideVolGlobal = !!session?.hideVol;
    hideVolEl.checked = hideVolGlobal;
    hideYAxisGlobal = !!session?.hideYAxis;
    hideYAxisEl.checked = hideYAxisGlobal;
    hideMaGlobal = !!session?.hideMa;
    hideMaEl.checked = hideMaGlobal;
    savedPanelStates = Array.isArray(session?.panels) ? session.panels.slice() : [];
    if (session?.hideGlobalBar) setBarHidden(true);

    const barPrefs = loadBarPrefs();
    showZtReasonOn = !!barPrefs.showZtReason;
    if (showZtReasonEl) showZtReasonEl.checked = showZtReasonOn;
    setZtReasonDisplay({ enabled: showZtReasonOn, byCode: {} });

    // 单图/多面板共用 kline-chart-settings：存默认后同步全体面板状态色
    window.addEventListener("kline-settings-saved", (ev) => {
      const next = ev?.detail;
      if (!next || typeof next !== "object") return;
      livePanels().forEach((p) => {
        try {
          p.setSettings({
            statusLimitUp: next.statusLimitUp,
            statusLimitDown: next.statusLimitDown,
            statusOneWordUp: next.statusOneWordUp,
            statusOneWordDown: next.statusOneWordDown,
            colorLimitUp: next.colorLimitUp,
            colorLimitDown: next.colorLimitDown,
            colorOneWordUp: next.colorOneWordUp,
            colorOneWordDown: next.colorOneWordDown,
            candleType: next.candleType,
          });
        } catch (_) {}
      });
    });

    refreshLayoutSelect(currentLayout.id);
    buildGrid(currentLayout, currentPeriod, pageSlice());
    syncUrl();
    loadAll();
  </script>
</body>
</html>
