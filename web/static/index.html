<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K线演示 · stock-sdk + KLineChart</title>
  <script src="/static/klinecharts.min.js"></script>
  <style>
    :root,
    html[data-theme="light"] {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --header-top: #ffffff;
      --header-bottom: #f7f9fb;
      --line: #d8dee6;
      --text: #1a2332;
      --muted: #6b7785;
      --input-bg: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover: #c5ced8;
      --btn-active-bg: #e8f1ff;
      --status-bg: rgba(255, 255, 255, 0.92);
      --modal-bg: #ffffff;
      --modal-mask: rgba(15, 23, 42, 0.35);
      --up: #e53935;
      --down: #00897b;
      --accent: #2f6fed;
      --font: "IBM Plex Sans", "PingFang SC", "Helvetica Neue", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    }

    html[data-theme="dark"] {
      --bg: #0f1419;
      --panel: #171d25;
      --header-top: #1a222c;
      --header-bottom: #171d25;
      --line: #2a3441;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --input-bg: #0c1015;
      --btn-bg: #121820;
      --btn-hover: #3a4a5c;
      --btn-active-bg: #1a2a40;
      --status-bg: rgba(15, 20, 25, 0.85);
      --modal-bg: #1b2330;
      --modal-mask: rgba(0, 0, 0, 0.55);
      --up: #ef5350;
      --down: #26a69a;
      --accent: #3d8bfd;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 窄工具栏（参考 preview.klinecharts.com） */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tb-quote {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      font-family: var(--mono);
      padding-right: 8px;
      border-right: 1px solid var(--line);
      margin-right: 2px;
    }
    .tb-name {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 650;
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #symbol {
      width: 78px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }
    #symbol:hover, #symbol:focus {
      border-color: var(--line);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }
    .tb-price { font-size: 15px; font-weight: 650; }
    .tb-change { font-size: 12px; }

    .tb-periods {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .tb-periods button {
      border: none;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 10px;
      height: 28px;
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
    }
    .tb-periods button:last-child { border-right: none; }
    .tb-periods button:hover { color: var(--text); background: var(--btn-active-bg); }
    .tb-periods button.active {
      color: var(--accent);
      background: var(--btn-active-bg);
      font-weight: 650;
    }

    .tb-tools {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .tb-tool {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }
    .tb-tool:hover { color: var(--text); background: var(--btn-active-bg); }
    .tb-tool svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .tb-tool .label { display: none; }
    @media (min-width: 720px) {
      .tb-tool .label { display: inline; }
    }

    input[type="number"] {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
    }
    button.primary {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .up { color: var(--up); }
    .down { color: var(--down); }

    #chart {
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      height: 0; /* flex 子项撑满剩余高度的可靠写法 */
      background: var(--panel);
    }

    .status {
      position: fixed;
      left: 18px;
      bottom: 14px;
      font-size: 12px;
      color: var(--muted);
      background: var(--status-bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 20;
    }

    /* Modal */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: var(--modal-mask);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: min(420px, calc(100vw - 32px));
      max-height: min(70vh, 560px);
      background: var(--modal-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-wide { width: min(480px, calc(100vw - 32px)); }
    .modal-settings { width: min(540px, calc(100vw - 32px)); }
    .modal-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 650;
      font-size: 16px;
    }
    .modal-hd .x {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
    }
    .modal-bd {
      padding: 12px 16px 16px;
      overflow: auto;
    }
    .modal-ft {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .setting-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 32px;
      padding: 8px 4px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
      font-size: 13px;
    }
    .setting-item select {
      min-width: 112px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 12px;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute;
      inset: 0;
      background: #c5cad3;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .switch .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    @media (max-width: 560px) {
      .setting-grid { grid-template-columns: 1fr; }
    }

    .ma-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
    }
    .ma-row label { color: var(--muted); min-width: 48px; }
    .ma-row input { width: 160px; text-align: right; }

    .ind-section { margin-bottom: 14px; }
    .ind-section h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .ind-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      cursor: pointer;
      border-radius: 6px;
      user-select: none;
    }
    .ind-item:hover { background: var(--btn-active-bg); }
    .ind-item input { width: 16px; height: 16px; accent-color: var(--accent); }

    /* 比较商品 chips */
    .overlay-chips {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
      padding: 4px 10px 6px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .overlay-chips.show { display: flex; }
    .overlay-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px 0 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--text);
      background: var(--input-bg);
    }
    .overlay-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .overlay-chip .x {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .overlay-chip .x:hover { color: var(--text); }

    /* 比较商品弹窗（参考 TradingView） */
    .modal-compare { width: min(560px, calc(100vw - 24px)); max-height: min(78vh, 640px); }
    .cmp-search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 0 12px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input-bg);
    }
    .cmp-search:focus-within { border-color: var(--accent); }
    .cmp-search svg { width: 18px; height: 18px; fill: var(--muted); flex-shrink: 0; }
    .cmp-search input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
      min-width: 0;
    }
    .cmp-search .clear {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 2px;
      display: none;
    }
    .cmp-search .clear.show { display: block; }
    .cmp-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .cmp-filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 14px;
      height: 28px;
      padding: 0 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .cmp-filters button:hover { color: var(--text); }
    .cmp-filters button.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--panel);
    }
    [data-theme="dark"] .cmp-filters button.active {
      background: #e8eaed;
      border-color: #e8eaed;
      color: #1a1d24;
    }
    .cmp-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: min(48vh, 420px);
      overflow: auto;
    }
    .cmp-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .cmp-item:hover, .cmp-item.active { background: var(--btn-active-bg); }
    .cmp-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--line);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 650;
      flex-shrink: 0;
    }
    .cmp-meta { flex: 1; min-width: 0; }
    .cmp-code {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 650;
      color: var(--accent);
    }
    .cmp-name {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cmp-right {
      text-align: right;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }
    .cmp-empty, .cmp-loading {
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .cmp-more {
      display: block;
      width: 100%;
      margin-top: 8px;
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .cmp-more:hover { color: var(--text); border-color: var(--btn-hover); }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="tb-quote">
        <span class="tb-name" id="stockName" title="股票名称">--</span>
        <input id="symbol" type="text" value="600036" maxlength="32" placeholder="代码" title="输入代码后回车查询" />
        <span class="tb-price" id="tbPrice">--</span>
        <span class="tb-change" id="tbChange">--</span>
      </div>
      <div class="tb-periods" id="periods" title="分时 / 周期">
        <button type="button" data-period="1m">1m</button>
        <button type="button" data-period="5m">5m</button>
        <button type="button" data-period="15m">15m</button>
        <button type="button" data-period="1h">1H</button>
        <button type="button" data-period="1d" class="active">1D</button>
        <button type="button" data-period="1w">1W</button>
      </div>
      <div class="tb-tools">
        <button type="button" class="tb-tool" id="btnCompare" title="比较商品">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span class="label">比较</span>
        </button>
        <button type="button" class="tb-tool" id="btnIndicator" title="指标">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16v2H4v-2zm2.5-3.5 3-3 2.5 2.5L18 8l1.5 1.5-7.5 7.5-2.5-2.5-2 2z"/></svg>
          <span class="label">指标</span>
        </button>
        <button type="button" class="tb-tool" id="btnSetting" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.9 2h-3.8a.49.49 0 0 0-.49.42l-.36 2.54c-.59.22-1.14.53-1.63.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.48a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.49.41 1.04.72 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.22 1.14-.53 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
          <span class="label">设置</span>
        </button>
        <button type="button" class="tb-tool" id="btnTheme" title="配色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c.55 0 1-.45 1-1 0-.26-.1-.51-.28-.7a.99.99 0 0 1-.72-.98c0-.55.45-1 1-1H16a5 5 0 0 0 0-10h-.17C14.72 4.08 13.43 3 12 3zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
          <span class="label">配色</span>
        </button>
      </div>
    </header>
    <div class="overlay-chips" id="overlayChips"></div>
    <div id="chart"></div>
  </div>
  <div class="status" id="status">初始化…</div>

  <!-- MA 自定义弹框 -->
  <div class="modal-mask" id="maModal">
    <div class="modal">
      <div class="modal-hd">
        <span>MA</span>
        <button type="button" class="x" data-close="maModal">×</button>
      </div>
      <div class="modal-bd" id="maModalBody"></div>
      <div class="modal-ft">
        <button type="button" class="primary" id="maConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 指标选择弹框 -->
  <div class="modal-mask" id="indModal">
    <div class="modal modal-wide">
      <div class="modal-hd">
        <span>指标</span>
        <button type="button" class="x" data-close="indModal">×</button>
      </div>
      <div class="modal-bd" id="indModalBody"></div>
    </div>
  </div>

  <!-- 比较商品（参考 TradingView） -->
  <div class="modal-mask" id="compareModal">
    <div class="modal modal-compare">
      <div class="modal-hd">
        <span>比较商品</span>
        <button type="button" class="x" data-close="compareModal">×</button>
      </div>
      <div class="modal-bd">
        <div class="cmp-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="cmpQuery" type="text" placeholder="搜索代码或名称" autocomplete="off" />
          <button type="button" class="clear" id="cmpClear" title="清除">×</button>
        </div>
        <div class="cmp-filters" id="cmpFilters">
          <button type="button" data-filter="all">全部</button>
          <button type="button" data-filter="cn" class="active">A股</button>
          <button type="button" data-filter="hk">港股</button>
          <button type="button" data-filter="us">美股</button>
          <button type="button" data-filter="fund">基金</button>
          <button type="button" data-filter="index">指数</button>
        </div>
        <ul class="cmp-list" id="cmpList"></ul>
        <button type="button" class="cmp-more" id="cmpMore" style="display:none">加载更多</button>
      </div>
    </div>
  </div>

  <!-- 图表设置（参考 preview.klinecharts.com） -->
  <div class="modal-mask" id="settingModal">
    <div class="modal modal-settings">
      <div class="modal-hd">
        <span>设置</span>
        <button type="button" class="x" data-close="settingModal">×</button>
      </div>
      <div class="modal-bd">
        <div class="setting-grid">
          <div class="setting-item">
            <span>蜡烛图类型</span>
            <select id="setCandleType">
              <option value="candle_solid">全实心</option>
              <option value="candle_stroke">全空心</option>
              <option value="candle_up_stroke">涨空心</option>
              <option value="candle_down_stroke">跌空心</option>
              <option value="ohlc">OHLC</option>
              <option value="area">面积图</option>
            </select>
          </div>
          <div class="setting-item">
            <span>最新价显示</span>
            <label class="switch"><input type="checkbox" id="setLastPrice" /><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <span>最高价显示</span>
            <label class="switch"><input type="checkbox" id="setHighPrice" /><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <span>最低价显示</span>
            <label class="switch"><input type="checkbox" id="setLowPrice" /><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <span>指标最新值显示</span>
            <label class="switch"><input type="checkbox" id="setIndLast" /><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <span>价格轴类型</span>
            <select id="setAxisType">
              <option value="normal">线性轴</option>
              <option value="percentage">百分比轴</option>
              <option value="log">对数轴</option>
            </select>
          </div>
          <div class="setting-item">
            <span>倒置坐标</span>
            <label class="switch"><input type="checkbox" id="setAxisReverse" /><span class="slider"></span></label>
          </div>
          <div class="setting-item">
            <span>网格线显示</span>
            <label class="switch"><input type="checkbox" id="setGrid" /><span class="slider"></span></label>
          </div>

      <div class="modal-ft">
        <button type="button" class="primary" id="settingReset">恢复默认</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { StockSDK, normalizeSymbol } from "/static/stock-sdk.mjs";

    const { init, registerIndicator } = klinecharts;
    const sdk = new StockSDK();

    // 叠加比较线（半透明，与主图蜡烛区分）
    const OVERLAY_COLORS = [
      "rgba(41, 98, 255, 0.85)",
      "rgba(255, 152, 0, 0.85)",
      "rgba(156, 39, 176, 0.85)",
      "rgba(0, 188, 212, 0.85)",
      "rgba(255, 87, 34, 0.85)",
      "rgba(63, 81, 181, 0.85)",
    ];
    let overlayColorIdx = 0;
    let compareOverlays = []; // { key, symbol, name, color, indicatorId }
    let compareFilter = "cn";
    let comparePage = 1;
    let compareHasMore = false;
    let compareSearchTimer = null;
    let compareLoading = false;
    let overlayIndicatorReady = false;
    let axisTypeBeforeCompare = null; // 叠加时切到百分比轴，清空后恢复

    function dayKey(ts) {
      const d = new Date(Number(ts));
      if (!Number.isFinite(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function ensureOverlayIndicator() {
      if (overlayIndicatorReady) return;
      registerIndicator({
        name: "OVERLAY_CMP",
        shortName: "CMP",
        series: "price",
        precision: 2,
        // 与主图同轴画线；calc 必须返回与 dataList 等长的数组
        figures: [{ key: "v", title: "CMP: ", type: "line" }],
        calc: (dataList, indicator) => {
          // 注意：klinecharts override 会 clone extendData，不能用 Map（会被克隆成空对象）
          const pack = indicator.extendData || {};
          const byTs = pack.byTs || {};
          const byDay = pack.byDay || {};
          return dataList.map((bar) => {
            const ts = bar.timestamp;
            let v = byTs[ts];
            if (v == null) v = byTs[String(ts)];
            if (v == null) v = byDay[dayKey(ts)];
            return v != null && Number.isFinite(Number(v)) ? { v: Number(v) } : {};
          });
        },
      });
      overlayIndicatorReady = true;
    }

    const PERIOD_MAP = {
      "1m": { type: "minute", span: 1 },
      "5m": { type: "minute", span: 5 },
      "15m": { type: "minute", span: 15 },
      "1h": { type: "minute", span: 60 },
      "1d": { type: "day", span: 1 },
      "1w": { type: "week", span: 1 },
    };
    const MINUTE_PERIOD = { "1m": "1", "5m": "5", "15m": "15", "1h": "60" };
    const HISTORY_PERIOD = { "1d": "daily", "1w": "weekly" };

    const MAIN_INDS = [
      { name: "MA", label: "MA(移动平均线)" },
      { name: "EMA", label: "EMA(指数平滑移动平均线)" },
      { name: "SMA", label: "SMA" },
      { name: "BOLL", label: "BOLL(布林线)" },
      { name: "SAR", label: "SAR(停损点转向指标)" },
      { name: "BBI", label: "BBI(多空指数)" },
    ];
    const SUB_INDS = [
      { name: "MA", label: "MA(移动平均线)" },
      { name: "EMA", label: "EMA(指数平滑移动平均线)" },
      { name: "VOL", label: "VOL(成交量)" },
      { name: "MACD", label: "MACD" },
      { name: "BOLL", label: "BOLL(布林线)" },
      { name: "KDJ", label: "KDJ" },
      { name: "RSI", label: "RSI" },
      { name: "BIAS", label: "BIAS" },
      { name: "CCI", label: "CCI" },
      { name: "DMI", label: "DMI" },
      { name: "WR", label: "WR" },
      { name: "OBV", label: "OBV" },
      { name: "SAR", label: "SAR" },
      { name: "BBI", label: "BBI" },
    ];

    // 默认均线 MA5 / MA20 / MA120（参考需求）
    const DEFAULT_MA = [5, 20, 120];
    const THEME_KEY = "kline-theme";
    const MA_KEY = "kline-ma-params";
    const SETTING_KEY = "kline-chart-settings";
    const DEFAULT_SETTINGS = {
      candleType: "candle_solid",
      lastPrice: true,
      highPrice: true,
      lowPrice: true,
      indLast: false,
      axisType: "normal",
      axisReverse: false,
      grid: true,
    };

    let currentPeriod = "1d";
    let currentTheme = localStorage.getItem(THEME_KEY) || "light";
    if (currentTheme !== "light" && currentTheme !== "dark") currentTheme = "light";
    let maParams = loadMaParams();
    let chartSettings = loadChartSettings();
    let chart = null;
    let pollTimer = null;
    let currentSymbol = "600036";
    let mainIndicators = ["MA"];
    let subIndicators = {}; // name -> paneId
    let settingTarget = null; // { name, paneId }

    function loadMaParams() {
      try {
        const raw = JSON.parse(localStorage.getItem(MA_KEY) || "null");
        if (Array.isArray(raw) && raw.some((n) => Number(n) > 0)) {
          return raw.map((n) => (n === "" || n == null ? "" : Number(n)));
        }
      } catch (_) {}
      return [...DEFAULT_MA, "", ""];
    }

    function loadChartSettings() {
      try {
        const raw = JSON.parse(localStorage.getItem(SETTING_KEY) || "null");
        if (raw && typeof raw === "object") return { ...DEFAULT_SETTINGS, ...raw };
      } catch (_) {}
      return { ...DEFAULT_SETTINGS };
    }

    function saveChartSettings() {
      localStorage.setItem(SETTING_KEY, JSON.stringify(chartSettings));
    }

    function activeMaParams(params = maParams) {
      return params.map(Number).filter((n) => Number.isFinite(n) && n > 0);
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function featureColor() {
      return currentTheme === "dark" ? "#929AA5" : "#76808F";
    }

    // 可见 / 隐藏 / 设置 / 关闭 — 参考 KLineChart Pro tooltip features
    function buildFeatures(visible) {
      const color = featureColor();
      const base = {
        position: "middle",
        marginLeft: 6,
        marginTop: 4,
        marginRight: 0,
        marginBottom: 0,
        paddingLeft: 0,
        paddingTop: 0,
        paddingRight: 0,
        paddingBottom: 0,
        size: 14,
        color,
        activeColor: color,
        backgroundColor: "transparent",
        activeBackgroundColor: "rgba(47, 111, 237, 0.15)",
        borderRadius: 2,
        type: "icon_font",
      };
      return [
        {
          ...base,
          id: visible ? "invisible" : "visible",
          content: { family: "sans-serif", code: visible ? "⊘" : "◉" },
        },
        {
          ...base,
          id: "setting",
          content: { family: "sans-serif", code: "⚙" },
        },
        {
          ...base,
          id: "close",
          content: { family: "sans-serif", code: "✕" },
        },
      ];
    }

    function tooltipSource({ indicator }) {
      return { features: buildFeatures(!!indicator.visible) };
    }

    function chartStyles() {
      const s = chartSettings;
      // A股习惯：红涨绿跌
      const up = "#F92855";
      const down = "#2DC08E";
      const upA = "rgba(249, 40, 85, 0.7)";
      const downA = "rgba(45, 192, 142, 0.7)";
      return {
        grid: {
          show: !!s.grid,
          horizontal: { show: !!s.grid },
          vertical: { show: !!s.grid },
        },
        candle: {
          type: s.candleType || "candle_solid",
          bar: {
            upColor: up,
            downColor: down,
            noChangeColor: "#888888",
            upBorderColor: up,
            downBorderColor: down,
            noChangeBorderColor: "#888888",
            upWickColor: up,
            downWickColor: down,
            noChangeWickColor: "#888888",
          },
          priceMark: {
            high: { show: !!s.highPrice },
            low: { show: !!s.lowPrice },
            last: {
              show: !!s.lastPrice,
              upColor: up,
              downColor: down,
              noChangeColor: "#888888",
            },
          },
          tooltip: {
            // 图上不显示股票代码标题
            title: { show: false },
          },
        },
        indicator: {
          lastValueMark: {
            show: !!s.indLast,
            text: { show: !!s.indLast },
          },
          ohlc: {
            upColor: upA,
            downColor: downA,
            noChangeColor: "#888888",
          },
          bars: [
            {
              upColor: upA,
              downColor: downA,
              noChangeColor: "#888888",
            },
          ],
        },
      };
    }

    function applyYAxisOptions() {
      if (!chart || typeof chart.overrideYAxis !== "function") return;
      try {
        chart.overrideYAxis({
          paneId: "candle_pane",
          type: chartSettings.axisType || "normal",
          reverse: !!chartSettings.axisReverse,
        });
      } catch (_) {}
    }

    function applyChartSettings() {
      if (!chart) return;
      chart.setStyles(chartStyles());
      applyYAxisOptions();
    }

    function syncSettingForm() {
      const s = chartSettings;
      document.getElementById("setCandleType").value = s.candleType;
      document.getElementById("setLastPrice").checked = !!s.lastPrice;
      document.getElementById("setHighPrice").checked = !!s.highPrice;
      document.getElementById("setLowPrice").checked = !!s.lowPrice;
      document.getElementById("setIndLast").checked = !!s.indLast;
      document.getElementById("setAxisType").value = s.axisType;
      document.getElementById("setAxisReverse").checked = !!s.axisReverse;
      document.getElementById("setGrid").checked = !!s.grid;
    }

    function readSettingForm() {
      chartSettings = {
        candleType: document.getElementById("setCandleType").value,
        lastPrice: document.getElementById("setLastPrice").checked,
        highPrice: document.getElementById("setHighPrice").checked,
        lowPrice: document.getElementById("setLowPrice").checked,
        indLast: document.getElementById("setIndLast").checked,
        axisType: document.getElementById("setAxisType").value,
        axisReverse: document.getElementById("setAxisReverse").checked,
        grid: document.getElementById("setGrid").checked,
      };
      saveChartSettings();
      applyChartSettings();
    }

    function openSettingModal() {
      syncSettingForm();
      document.getElementById("settingModal").classList.add("show");
    }

    function resetChartSettings() {
      chartSettings = { ...DEFAULT_SETTINGS };
      saveChartSettings();
      syncSettingForm();
      applyChartSettings();
    }

    function applyPageTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const btn = document.getElementById("btnTheme");
      if (btn) btn.title = theme === "dark" ? "配色（当前：暗色）" : "配色（当前：亮色）";
    }

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem(THEME_KEY, theme);
      applyPageTheme(theme);
      if (!chart) return;
      chart.setStyles(theme);
      applyChartSettings();
      // 刷新 feature 颜色
      refreshAllIndicatorFeatures();
    }

    function toggleTheme() {
      setTheme(currentTheme === "dark" ? "light" : "dark");
    }

    function refreshAllIndicatorFeatures() {
      if (!chart) return;
      const list = chart.getIndicators() || [];
      list.forEach((ind) => {
        chart.overrideIndicator({
          id: ind.id,
          createTooltipDataSource: tooltipSource,
        });
      });
    }

    function resolveMarket(input) {
      return normalizeSymbol(input).market;
    }

    function toBars(rows) {
      return (rows || [])
        .map((b) => {
          let ts = b.timestamp;
          if (ts == null) {
            const raw = b.time || b.date;
            if (!raw) return null;
            const parsed = Date.parse(String(raw).replace(/-/g, "/"));
            if (!Number.isFinite(parsed)) return null;
            ts = parsed;
          }
          return {
            timestamp: Number(ts),
            open: Number(b.open),
            high: Number(b.high),
            low: Number(b.low),
            close: Number(b.close),
            volume: Number(b.volume ?? 0),
            turnover: Number(b.amount ?? 0),
          };
        })
        .filter((b) => b && Number.isFinite(b.timestamp) && Number.isFinite(b.close))
        .sort((a, b) => a.timestamp - b.timestamp);
    }

    async function fetchQuote(symbol) {
      const market = resolveMarket(symbol);
      let list;
      if (market === "US") list = await sdk.quotes.us([symbol]);
      else if (market === "HK") list = await sdk.quotes.hk([symbol]);
      else list = await sdk.quotes.cnSimple([symbol]);
      if (!list?.length) throw new Error("行情为空");
      return { market, quote: list[0] };
    }

    async function fetchKline(symbol, period) {
      const market = resolveMarket(symbol);
      const isMinute = period in MINUTE_PERIOD;
      let rows;
      if (isMinute) {
        const p = MINUTE_PERIOD[period];
        if (market === "US") rows = await sdk.kline.usMinute(symbol, { period: p });
        else if (market === "HK") rows = await sdk.kline.hkMinute(symbol, { period: p });
        else rows = await sdk.kline.cnMinute(symbol, { period: p });
      } else {
        const p = HISTORY_PERIOD[period] || "daily";
        if (market === "US") rows = await sdk.kline.us(symbol, { period: p, adjust: "qfq" });
        else if (market === "HK") rows = await sdk.kline.hk(symbol, { period: p, adjust: "qfq" });
        else rows = await sdk.kline.cn(symbol, { period: p, adjust: "qfq" });
      }
      if (!isMinute && Array.isArray(rows) && rows.length > 500) rows = rows.slice(-500);
      return { market, bars: toBars(rows) };
    }

    function hitToSymbol(hit) {
      if (hit.symbol) return hit.symbol;
      const code = String(hit.code || "").trim();
      if (!code) return "";
      // search 返回 sh600036 / hk00700 / usAAPL
      if (/^(sh|sz|bj|hk|us)/i.test(code)) return code;
      const m = String(hit.market || "").toLowerCase();
      if (m === "sh" || m === "sz" || m === "bj") return `${m}${code}`;
      if (m === "hk") return code.padStart(5, "0");
      if (m === "us") return code.toUpperCase();
      return code;
    }

    function marketLabelOf(hit) {
      if (hit.marketLabel) return hit.marketLabel;
      if (hit.exchange) return hit.exchange;
      const m = String(hit.market || "").toLowerCase();
      if (m === "cn" || m === "sh" || m === "sz" || m === "bj") return "A股";
      if (m === "hk") return "港股";
      if (m === "us") return "美股";
      if (m === "fund") return "基金";
      if (m === "index") return "指数";
      return (hit.category || m || "--").toUpperCase();
    }

    function filterSearchHits(hits, filter) {
      const list = hits || [];
      if (filter === "all") return list;
      return list.filter((h) => {
        const m = String(h.market || "").toLowerCase();
        const cat = String(h.category || "").toLowerCase();
        const code = String(h.code || "").toLowerCase();
        if (filter === "cn") {
          return m === "sh" || m === "sz" || m === "bj" || code.startsWith("sh") || code.startsWith("sz") || code.startsWith("bj");
        }
        if (filter === "hk") return m === "hk" || code.startsWith("hk");
        if (filter === "us") return m === "us" || code.startsWith("us");
        if (filter === "fund") return cat === "fund" || /lof|etf|fj/i.test(String(h.type || ""));
        if (filter === "index") return cat === "index";
        return true;
      });
    }

    function renderCompareList(items, { append = false } = {}) {
      const ul = document.getElementById("cmpList");
      if (!append) ul.innerHTML = "";
      if (!items.length && !append) {
        ul.innerHTML = `<li class="cmp-empty">无匹配结果</li>`;
        return;
      }
      const frag = document.createDocumentFragment();
      items.forEach((hit) => {
        const symbol = hitToSymbol(hit);
        const code = hit.code || symbol;
        const name = hit.name || "--";
        const li = document.createElement("li");
        li.className = "cmp-item";
        li.dataset.symbol = symbol;
        li.dataset.name = name;
        const avatar = (name || code).slice(0, 1);
        li.innerHTML = `
          <span class="cmp-avatar">${avatar}</span>
          <span class="cmp-meta">
            <div class="cmp-code">${code.replace(/^(sh|sz|bj|hk|us)/i, "")}</div>
            <div class="cmp-name">${name}</div>
          </span>
          <span class="cmp-right">
            <div>${marketLabelOf(hit)}</div>
            <div>${hit.exchange || hit.category || ""}</div>
          </span>
        `;
        frag.appendChild(li);
      });
      ul.appendChild(frag);
    }

    async function loadCompareBrowse({ append = false } = {}) {
      if (compareLoading) return;
      const filter = compareFilter === "all" ? "cn" : compareFilter;
      if (!append) {
        comparePage = 1;
        document.getElementById("cmpList").innerHTML = `<li class="cmp-loading">加载中…</li>`;
      }
      compareLoading = true;
      try {
        const url = `/api/symbols?market=${encodeURIComponent(filter)}&page=${comparePage}&size=60`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "列表失败");
        renderCompareList(data.items || [], { append });
        const loaded = comparePage * (data.size || 60);
        compareHasMore = loaded < (data.total || 0);
        document.getElementById("cmpMore").style.display = compareHasMore ? "block" : "none";
      } catch (e) {
        if (!append) {
          document.getElementById("cmpList").innerHTML =
            `<li class="cmp-empty">列表加载失败：${e.message || e}<br/>可直接搜索代码</li>`;
        }
        document.getElementById("cmpMore").style.display = "none";
      } finally {
        compareLoading = false;
      }
    }

    async function loadCompareSearch(keyword) {
      const q = (keyword || "").trim();
      if (!q) {
        await loadCompareBrowse({ append: false });
        return;
      }
      document.getElementById("cmpMore").style.display = "none";
      document.getElementById("cmpList").innerHTML = `<li class="cmp-loading">搜索中…</li>`;
      try {
        const hits = await sdk.search(q);
        const filtered = filterSearchHits(hits, compareFilter);
        renderCompareList(
          filtered.map((h) => ({
            ...h,
            symbol: hitToSymbol(h),
            exchange: marketLabelOf(h),
          }))
        );
      } catch (e) {
        document.getElementById("cmpList").innerHTML =
          `<li class="cmp-empty">搜索失败：${e.message || e}</li>`;
      }
    }

    function openCompareModal() {
      document.getElementById("compareModal").classList.add("show");
      const input = document.getElementById("cmpQuery");
      input.value = "";
      document.getElementById("cmpClear").classList.remove("show");
      // 默认展示 A 股列表
      if (compareFilter === "all") {
        compareFilter = "cn";
        document.querySelectorAll("#cmpFilters button").forEach((b) => {
          b.classList.toggle("active", b.dataset.filter === "cn");
        });
      }
      loadCompareBrowse({ append: false });
      setTimeout(() => input.focus(), 50);
    }

    function renderOverlayChips() {
      const box = document.getElementById("overlayChips");
      if (!compareOverlays.length) {
        box.classList.remove("show");
        box.innerHTML = "";
      } else {
        box.classList.add("show");
        box.innerHTML = compareOverlays
          .map(
            (o) => `
        <span class="overlay-chip" data-key="${o.key}">
          <span class="dot" style="background:${o.color}"></span>
          <span>${o.name || o.symbol}</span>
          <button type="button" class="x" data-remove="${o.key}" title="移除">×</button>
        </span>`
          )
          .join("");
      }
      // chips 显隐会改变图表容器高度
      if (chart) {
        requestAnimationFrame(() => {
          try {
            chart.resize();
          } catch (_) {}
        });
      }
    }

    function lookupClose(byTs, byDay, ts) {
      let v = byTs[ts];
      if (v == null) v = byTs[String(ts)];
      if (v == null) v = byDay[dayKey(ts)];
      return v;
    }

    function buildOverlayData(primaryBars, secondaryBars) {
      // 用普通对象（勿用 Map：库内部 clone 会丢 Map 内容）
      // 将副图按「重叠首根」缩放到主图价格，便于同轴；叠加时还会切百分比轴
      const byTsRaw = Object.create(null);
      const byDayRaw = Object.create(null);
      for (const b of secondaryBars) {
        const ts = b.timestamp;
        byTsRaw[ts] = b.close;
        byTsRaw[String(ts)] = b.close;
        const dk = dayKey(ts);
        if (dk && byDayRaw[dk] == null) byDayRaw[dk] = b.close;
      }
      let basePri = null;
      let baseSec = null;
      for (const b of primaryBars) {
        const sec = lookupClose(byTsRaw, byDayRaw, b.timestamp);
        if (sec != null && sec !== 0) {
          basePri = b.close;
          baseSec = sec;
          break;
        }
      }
      const ratio = basePri && baseSec ? basePri / baseSec : 1;
      const byTs = Object.create(null);
      const byDay = Object.create(null);
      for (const k of Object.keys(byTsRaw)) byTs[k] = byTsRaw[k] * ratio;
      for (const k of Object.keys(byDayRaw)) byDay[k] = byDayRaw[k] * ratio;
      return { byTs, byDay };
    }

    function enableCompareAxis() {
      if (!chart || axisTypeBeforeCompare != null) return;
      axisTypeBeforeCompare = chartSettings.axisType || "normal";
      try {
        chart.overrideYAxis({ paneId: "candle_pane", type: "percentage" });
      } catch (_) {}
    }

    function restoreCompareAxis() {
      if (!chart || axisTypeBeforeCompare == null) return;
      const t = axisTypeBeforeCompare;
      axisTypeBeforeCompare = null;
      try {
        chart.overrideYAxis({
          paneId: "candle_pane",
          type: chartSettings.axisType || t || "normal",
        });
      } catch (_) {}
    }

    async function addCompareOverlay(item) {
      const symbol = hitToSymbol(item);
      if (!symbol) return;
      let norm;
      try {
        norm = normalizeSymbol(symbol);
      } catch (e) {
        setStatus(`无法叠加：${e.message || e}`);
        return;
      }
      const key = `${norm.market}:${norm.code}`;
      if (compareOverlays.some((o) => o.key === key)) {
        setStatus(`${item.name || norm.code} 已在比较中`);
        document.getElementById("compareModal").classList.remove("show");
        return;
      }
      if (currentSymbol && normalizeSymbol(currentSymbol).code === norm.code &&
          resolveMarket(currentSymbol) === norm.market) {
        setStatus("不能与当前标的相同");
        return;
      }
      if (!chart) {
        setStatus("请先加载主图");
        return;
      }
      ensureOverlayIndicator();
      setStatus(`叠加 ${item.name || norm.code} …`);
      try {
        const primary = chart.getDataList?.() || [];
        const { bars } = await fetchKline(symbol, currentPeriod);
        if (!bars.length) throw new Error("无 K 线数据");
        const overlayData = buildOverlayData(primary, bars);
        const matched = primary.filter((b) => {
          return (
            overlayData.byTs[b.timestamp] != null ||
            overlayData.byTs[String(b.timestamp)] != null ||
            overlayData.byDay[dayKey(b.timestamp)] != null
          );
        }).length;
        if (!matched) throw new Error("时间轴无法对齐，请换同市场标的或日线周期试试");
        const color = OVERLAY_COLORS[overlayColorIdx % OVERLAY_COLORS.length];
        overlayColorIdx += 1;
        const short = (item.name || norm.code).slice(0, 8);
        const indicatorId = `OVERLAY_CMP_${key.replace(/[^a-zA-Z0-9]/g, "_")}`;
        const createdId = chart.createIndicator(
          {
            id: indicatorId,
            name: "OVERLAY_CMP",
            shortName: short,
            paneId: "candle_pane",
            extendData: overlayData,
            styles: {
              lines: [{ color, size: 2, style: "solid" }],
            },
            createTooltipDataSource: () => ({
              features: [
                {
                  id: "close",
                  position: "middle",
                  marginLeft: 6,
                  marginTop: 0,
                  marginRight: 0,
                  marginBottom: 0,
                  paddingLeft: 0,
                  paddingTop: 0,
                  paddingRight: 0,
                  paddingBottom: 0,
                  size: 14,
                  color: featureColor(),
                  activeColor: featureColor(),
                  backgroundColor: "transparent",
                  activeBackgroundColor: "rgba(47, 111, 237, 0.15)",
                  borderRadius: 2,
                  type: "icon_font",
                  content: { family: "sans-serif", code: "✕" },
                },
              ],
            }),
          },
          true
        );
        if (!createdId) throw new Error("createIndicator 失败（可能重复或未注册）");
        // 强制再写一次 extendData，确保 calc 用到完整数据
        chart.overrideIndicator({
          id: indicatorId,
          extendData: overlayData,
          styles: { lines: [{ color, size: 2, style: "solid" }] },
        });
        compareOverlays.push({
          key,
          symbol,
          name: item.name || norm.code,
          color,
          indicatorId,
          paneId: "candle_pane",
        });
        enableCompareAxis();
        renderOverlayChips();
        document.getElementById("compareModal").classList.remove("show");
        setStatus(`已叠加 ${item.name || norm.code}（${matched} 点对齐，百分比坐标）`);
      } catch (e) {
        setStatus(`叠加失败: ${e.message || e}`);
      }
    }

    function removeCompareOverlay(key) {
      const idx = compareOverlays.findIndex((o) => o.key === key);
      if (idx < 0 || !chart) return;
      const [o] = compareOverlays.splice(idx, 1);
      if (o.indicatorId) {
        chart.removeIndicator({ id: o.indicatorId });
      } else {
        chart.removeIndicator({ paneId: "candle_pane", name: "OVERLAY_CMP" });
      }
      if (!compareOverlays.length) restoreCompareAxis();
      renderOverlayChips();
    }

    async function refreshCompareOverlays() {
      if (!chart || !compareOverlays.length) return;
      ensureOverlayIndicator();
      const primary = chart.getDataList?.() || [];
      for (const o of compareOverlays) {
        try {
          const { bars } = await fetchKline(o.symbol, currentPeriod);
          const overlayData = buildOverlayData(primary, bars);
          if (o.indicatorId) {
            chart.overrideIndicator({
              id: o.indicatorId,
              extendData: overlayData,
              styles: { lines: [{ color: o.color, size: 2, style: "solid" }] },
            });
          }
        } catch (_) {}
      }
    }

    function renderQuote(symbol, q) {
      const change = Number(q.change ?? (q.price - (q.prevClose ?? q.price)));
      const pct = Number(q.changePercent ?? 0);
      const cls = change >= 0 ? "up" : "down";
      const sign = change >= 0 ? "+" : "";
      const code = q.code || symbol;
      document.getElementById("stockName").textContent = q.name || "--";
      const priceEl = document.getElementById("tbPrice");
      const changeEl = document.getElementById("tbChange");
      priceEl.className = `tb-price ${cls}`;
      changeEl.className = `tb-change ${cls}`;
      priceEl.textContent = Number(q.price).toFixed(2);
      changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
      document.title = `${q.name || code} ${Number(q.price).toFixed(2)} · K线`;
    }

    function createInd(name, isStack, paneId) {
      const params = activeMaParams();
      const opts = {
        name,
        createTooltipDataSource: tooltipSource,
      };
      if (paneId) opts.paneId = paneId;
      // 主图 MA / 副图 VOL / 副图 MA：统一均线周期
      if (name === "MA" || name === "VOL" || name === "EMA") {
        opts.calcParams = [...params];
      }
      return chart.createIndicator(opts, isStack);
    }

    function syncMaToAllPanels() {
      if (!chart) return;
      const params = activeMaParams();
      const list = chart.getIndicators() || [];
      list.forEach((ind) => {
        if (ind.name === "MA" || ind.name === "VOL" || ind.name === "EMA") {
          chart.overrideIndicator({
            id: ind.id,
            calcParams: [...params],
          });
        }
      });
    }

    function ensureChart(market) {
      const tz =
        market === "US" ? "America/New_York" : market === "HK" ? "Asia/Hong_Kong" : "Asia/Shanghai";
      if (chart) {
        chart.setTimezone(tz);
        return chart;
      }
      chart = init("chart", {
        locale: "zh-CN",
        timezone: tz,
        styles: currentTheme,
        layout: {
          yAxis: {
            type: chartSettings.axisType || "normal",
            reverse: !!chartSettings.axisReverse,
          },
        },
      });
      window.__chart = chart;
      applyChartSettings();
      requestAnimationFrame(() => {
        try {
          chart.resize();
        } catch (_) {}
      });

      // 默认主图 MA + 副图 VOL / MACD
      mainIndicators = ["MA"];
      subIndicators = {};
      createInd("MA", true, "candle_pane");
      const volPane = createInd("VOL", false);
      if (volPane) subIndicators.VOL = volPane;
      const macdPane = createInd("MACD", false);
      if (macdPane) subIndicators.MACD = macdPane;

      chart.subscribeAction("onIndicatorTooltipFeatureClick", (data) => {
        const featureId = data?.feature?.id;
        const ind = data?.indicator;
        const paneId = data?.paneId;
        if (!featureId || !ind) return;
        if (featureId === "visible") {
          chart.overrideIndicator({ id: ind.id, visible: true, createTooltipDataSource: tooltipSource });
        } else if (featureId === "invisible") {
          chart.overrideIndicator({ id: ind.id, visible: false, createTooltipDataSource: tooltipSource });
        } else if (featureId === "setting") {
          if (["MA", "VOL", "EMA"].includes(ind.name)) {
            openMaSetting(ind.name, paneId, ind.calcParams || activeMaParams());
          } else {
            setStatus(`${ind.name} 暂不支持参数自定义（可自定义 MA / VOL / EMA 均线）`);
          }
        } else if (featureId === "close") {
          if (ind.name === "OVERLAY_CMP") {
            const ov = compareOverlays.find((o) => o.indicatorId === ind.id);
            if (ov) removeCompareOverlay(ov.key);
            else chart.removeIndicator({ id: ind.id });
          } else {
            closeIndicator(ind.name, paneId);
          }
        }
      });

      return chart;
    }

    function closeIndicator(name, paneId) {
      if (!chart) return;
      if (paneId === "candle_pane") {
        chart.removeIndicator({ paneId: "candle_pane", name });
        mainIndicators = mainIndicators.filter((n) => n !== name);
      } else {
        chart.removeIndicator({ paneId, name });
        delete subIndicators[name];
      }
    }

    function openMaSetting(name, paneId, calcParams) {
      // 仅对 MA / VOL / EMA 打开均线自定义（与图2一致）；其它指标暂复用均线编辑
      settingTarget = { name, paneId };
      const vals = Array.isArray(calcParams) ? [...calcParams] : activeMaParams();
      while (vals.length < 5) vals.push("");
      const body = document.getElementById("maModalBody");
      body.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const row = document.createElement("div");
        row.className = "ma-row";
        row.innerHTML = `
          <label>MA${i + 1}</label>
          <input type="number" min="1" step="1" data-idx="${i}" value="${vals[i] ?? ""}" />
        `;
        body.appendChild(row);
      }
      document.getElementById("maModal").classList.add("show");
    }

    function confirmMaSetting() {
      const inputs = [...document.querySelectorAll("#maModalBody input")];
      const next = inputs.map((el) => {
        const v = el.value.trim();
        if (v === "") return "";
        const n = Number(v);
        return Number.isFinite(n) && n > 0 ? Math.floor(n) : "";
      });
      maParams = next;
      localStorage.setItem(MA_KEY, JSON.stringify(maParams));
      // 同步所有相关面板均线
      syncMaToAllPanels();
      document.getElementById("maModal").classList.remove("show");
      settingTarget = null;
    }

    function openIndicatorModal() {
      const body = document.getElementById("indModalBody");
      body.innerHTML = "";

      const mainSec = document.createElement("div");
      mainSec.className = "ind-section";
      mainSec.innerHTML = "<h4>主图指标</h4>";
      MAIN_INDS.forEach((item) => {
        const checked = mainIndicators.includes(item.name);
        const row = document.createElement("label");
        row.className = "ind-item";
        row.innerHTML = `<input type="checkbox" data-kind="main" data-name="${item.name}" ${checked ? "checked" : ""}/><span>${item.label}</span>`;
        mainSec.appendChild(row);
      });
      body.appendChild(mainSec);

      const subSec = document.createElement("div");
      subSec.className = "ind-section";
      subSec.innerHTML = "<h4>副图指标</h4>";
      SUB_INDS.forEach((item) => {
        const checked = item.name in subIndicators;
        const row = document.createElement("label");
        row.className = "ind-item";
        row.innerHTML = `<input type="checkbox" data-kind="sub" data-name="${item.name}" ${checked ? "checked" : ""}/><span>${item.label}</span>`;
        subSec.appendChild(row);
      });
      body.appendChild(subSec);

      body.querySelectorAll("input[type=checkbox]").forEach((input) => {
        input.addEventListener("change", () => {
          const name = input.dataset.name;
          const kind = input.dataset.kind;
          if (kind === "main") toggleMain(name, input.checked);
          else toggleSub(name, input.checked);
        });
      });

      document.getElementById("indModal").classList.add("show");
    }

    function toggleMain(name, added) {
      if (!chart) return;
      if (added) {
        if (!mainIndicators.includes(name)) {
          createInd(name, true, "candle_pane");
          mainIndicators.push(name);
        }
      } else {
        chart.removeIndicator({ paneId: "candle_pane", name });
        mainIndicators = mainIndicators.filter((n) => n !== name);
      }
    }

    function toggleSub(name, added) {
      if (!chart) return;
      if (added) {
        if (!(name in subIndicators)) {
          const paneId = createInd(name, false);
          if (paneId) subIndicators[name] = paneId;
        }
      } else if (subIndicators[name]) {
        chart.removeIndicator({ paneId: subIndicators[name], name });
        delete subIndicators[name];
      }
    }

    function bindDataLoader(symbol) {
      let market = "CN";
      try {
        market = resolveMarket(symbol);
      } catch (_) {}
      const c = ensureChart(market);
      // ticker 仍用于内部，但图上标题已关闭，不显示代码
      c.setSymbol({ ticker: symbol, pricePrecision: 2, volumePrecision: 0 });
      c.setPeriod(PERIOD_MAP[currentPeriod]);
      c.setDataLoader({
        async getBars({ type, callback }) {
          if (type !== "init") {
            callback([], false);
            return;
          }
          try {
            setStatus(`加载 ${symbol} ${currentPeriod} …`);
            const data = await fetchKline(symbol, currentPeriod);
            ensureChart(data.market);
            callback(data.bars, false);
            setStatus(`${symbol} · ${currentPeriod} · ${data.bars.length} 根K线 · 数据源 stock-sdk`);
            // 主图刷新后同步叠加比较线，并校正高度
            queueMicrotask(() => {
              refreshCompareOverlays();
              try {
                chart.resize();
              } catch (_) {}
            });
          } catch (e) {
            setStatus(`加载失败: ${e.message || e}`);
            callback([], false);
          }
        },
      });
    }

    async function refreshQuote(symbol) {
      try {
        const { quote } = await fetchQuote(symbol);
        renderQuote(symbol, quote);
      } catch (e) {
        setStatus(`行情: ${e.message || e}`);
      }
    }

    function readUrlParams() {
      const q = new URLSearchParams(location.search);
      // 兼容 symbol / code / s / ticker
      const symbol = (
        q.get("symbol") ||
        q.get("code") ||
        q.get("s") ||
        q.get("ticker") ||
        ""
      ).trim();
      const period = (q.get("period") || "").trim();
      return { symbol, period };
    }

    function syncUrl(symbol, period, replace = true) {
      const url = new URL(location.href);
      url.searchParams.set("symbol", symbol);
      if (period) url.searchParams.set("period", period);
      else url.searchParams.delete("period");
      // 清理旧别名参数，保持 URL 干净
      ["code", "s", "ticker"].forEach((k) => url.searchParams.delete(k));
      const next = `${url.pathname}?${url.searchParams.toString()}${url.hash || ""}`;
      if (replace) history.replaceState({ symbol, period }, "", next);
      else history.pushState({ symbol, period }, "", next);
    }

    function applyPeriodUI(period) {
      if (!PERIOD_MAP[period]) return false;
      currentPeriod = period;
      document.querySelectorAll("#periods button").forEach((b) => {
        b.classList.toggle("active", b.dataset.period === period);
      });
      return true;
    }

    async function load(options = {}) {
      const { pushUrl = false, skipUrlSync = false } = options;
      const symbol = (document.getElementById("symbol").value || "").trim();
      if (!symbol) {
        setStatus("请输入代码，如 600036 / 00700 / AAPL / 105.AAPL");
        return;
      }
      try {
        normalizeSymbol(symbol);
      } catch (e) {
        setStatus(`无效代码: ${e.message || e}`);
        return;
      }
      currentSymbol = symbol;
      if (!skipUrlSync) syncUrl(symbol, currentPeriod, !pushUrl);
      bindDataLoader(symbol);
      await refreshQuote(symbol);
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => refreshQuote(currentSymbol), 15000);
    }

    function bootstrapFromUrl() {
      const { symbol, period } = readUrlParams();
      if (period) applyPeriodUI(period);
      if (symbol) document.getElementById("symbol").value = symbol;
      load({ skipUrlSync: false });
    }

    // events
    document.getElementById("symbol").addEventListener("keydown", (e) => {
      if (e.key === "Enter") load({ pushUrl: true });
    });
    document.getElementById("symbol").addEventListener("blur", () => {
      const v = (document.getElementById("symbol").value || "").trim();
      if (v && v !== currentSymbol) load({ pushUrl: true });
    });
    document.getElementById("periods").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-period]");
      if (!btn) return;
      applyPeriodUI(btn.dataset.period);
      load({ pushUrl: true });
    });
    document.getElementById("btnCompare").addEventListener("click", openCompareModal);
    document.getElementById("btnIndicator").addEventListener("click", openIndicatorModal);
    document.getElementById("btnSetting").addEventListener("click", openSettingModal);
    document.getElementById("btnTheme").addEventListener("click", toggleTheme);

    document.getElementById("cmpFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      compareFilter = btn.dataset.filter;
      document.querySelectorAll("#cmpFilters button").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      const q = document.getElementById("cmpQuery").value.trim();
      if (q) loadCompareSearch(q);
      else loadCompareBrowse({ append: false });
    });
    document.getElementById("cmpQuery").addEventListener("input", (e) => {
      const v = e.target.value;
      document.getElementById("cmpClear").classList.toggle("show", !!v.trim());
      clearTimeout(compareSearchTimer);
      compareSearchTimer = setTimeout(() => loadCompareSearch(v), 280);
    });
    document.getElementById("cmpClear").addEventListener("click", () => {
      document.getElementById("cmpQuery").value = "";
      document.getElementById("cmpClear").classList.remove("show");
      loadCompareBrowse({ append: false });
    });
    document.getElementById("cmpList").addEventListener("click", (e) => {
      const row = e.target.closest(".cmp-item");
      if (!row || !row.dataset.symbol) return;
      addCompareOverlay({
        symbol: row.dataset.symbol,
        name: row.dataset.name,
        code: row.dataset.symbol,
      });
    });
    document.getElementById("cmpMore").addEventListener("click", () => {
      if (!compareHasMore || compareLoading) return;
      comparePage += 1;
      loadCompareBrowse({ append: true });
    });
    document.getElementById("overlayChips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove]");
      if (!btn) return;
      removeCompareOverlay(btn.dataset.remove);
    });
    document.getElementById("settingReset").addEventListener("click", resetChartSettings);
    document.getElementById("settingModal").addEventListener("change", (e) => {
      if (e.target.closest(".setting-grid")) readSettingForm();
    });
    document.getElementById("maConfirm").addEventListener("click", confirmMaSetting);
    document.querySelectorAll("[data-close]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.getElementById(btn.dataset.close).classList.remove("show");
      });
    });
    document.querySelectorAll(".modal-mask").forEach((mask) => {
      mask.addEventListener("click", (e) => {
        if (e.target === mask) mask.classList.remove("show");
      });
    });
    window.addEventListener("popstate", () => {
      const { symbol, period } = readUrlParams();
      if (period) applyPeriodUI(period);
      if (symbol) document.getElementById("symbol").value = symbol;
      load({ skipUrlSync: true });
    });

    window.addEventListener("resize", () => {
      if (chart) {
        try {
          chart.resize();
        } catch (_) {}
      }
    });

    applyPageTheme(currentTheme);
    bootstrapFromUrl();
  </script>
</body>
</html>
